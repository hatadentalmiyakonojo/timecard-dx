  const vz=validateMonth(stZero, seedDocFromCSV(SAMPLE_CSV_2026_06), '2026-06', C, {full:true});
  T.push(['検証: 月内データゼロの職員→ブロックでなく警告1件',
    vz.blocks.filter(x=>x.sid===9).length===0 && vz.warns.filter(x=>x.sid===9).length===1]);
  // 半休日は休憩打刻なし警告を出さない
  const vh=validateMonth([{id:1,name:'A',active:true,order:1}], seedDocFromCSV(SAMPLE_CSV_2026_06), '2026-06', C, {full:true});
  T.push(['検証: 半日有給(6/17)に休憩なし警告を出さない', !vh.warns.some(x=>x.d==='2026-06-17')]);
  // 終日有給行の形式
  const d11=emptyMonthDoc(); d11.days['1|2026-06-05']={leave:'full_paid'};
  const r11=buildMonthRows(st1,d11,'2026-06');
  T.push(['CSV: 終日有給行= date,1,,,0,full_paid,0', eq(r11[0],['2026-06-05',1,'','',0,'full_paid',0])]);
  // 月外データ混入防御
  const d12=emptyMonthDoc();
  d12.punches.push({id:'a',sid:1,d:'2026-07-01',t:'08:30',ty:'in',at:1,src:'tap',ph:0,void:0});
  T.push(['CSV: 月外の打刻は出力されない', buildMonthRows(st1,d12,'2026-06').length===0]);
  // 退職者（在籍オフ）でも当月データがあれば締め対象に含まれる（給与未払い防止）
  const dRet=emptyMonthDoc();
  dRet.punches.push({id:'a',sid:5,d:'2026-06-01',t:'08:30',ty:'in',at:1,src:'tap',ph:0,void:0});
  const stRet=[{id:1,name:'A',active:true,order:1},{id:5,name:'退職',active:false,order:5},
    {id:9,name:'無関係退職',active:false,order:9}];
  const sfm=staffForMonth(dRet, stRet);
  T.push(['締め対象: 退職者でも当月打刻ありは含む', sfm.some(s=>s.id===5)]);
  T.push(['締め対象: 退職者でデータなしは含まない', !sfm.some(s=>s.id===9)]);
  T.push(['CSV: 退職者の打刻が出力される',
    buildMonthRows(sfm,dRet,'2026-06').some(r=>r[1]===5)]);
  const vRet=validateMonth(sfm,dRet,'2026-06',C,{full:true});
  T.push(['検証: 退職者の空白日はブロックでなく警告',
    !vRet.blocks.some(x=>x.sid===5&&x.d!=='2026-06-01') && vRet.warns.some(x=>x.sid===5)]);
  // 院内保管庫（Mac mini）
  T.push(['保管庫: 部品(createVault)が読み込まれている', typeof createVault==='function']);
  T.push(['保管庫: セルフテスト中は保管庫を作らない（見本データを送らない）', vault===null]);
  T.push(['保管庫: 送る中身はJSONバックアップと同じ形（書き出し時刻だけ除く＝同じ中身は重複として捨てられる）', (()=>{ try{
    const s=vaultSnapshot(), d=s.data;
    return eq(Object.keys(d),['app','version','schema','settings','staff','months']) &&
      JSON.stringify(vaultSnapshot().data)===JSON.stringify(d) &&
      d.app==='dakoku' && Array.isArray(d.staff) && typeof d.months==='object' && !validateBackupData(d) &&
      typeof s.counts.staff==='number' && typeof s.counts.punches==='number';
  }catch(e){ return false; } })()]);
  T.push(['保管庫: 件数=職員数と打刻記録数（取消済み含む）', eq(vaultCounts({staff:[{id:1},{id:2}],
    months:{'2026-06':{punches:[{id:'a'},{id:'b',void:1}]},'2026-07':{punches:[{id:'c'}]}}}),{staff:2,punches:3})]);
  T.push(['保管庫: 打刻写真は Mac mini に送らない（院長決定 2026-09-24）', VAULT_SEND_PHOTOS===false]);
  T.push(['保管庫: 打刻IDは写真IDとしてそのまま送れる形', [genId(),genId(),genId()].every(id=>VAULT_ID_RE.test(id))]);
  T.push(['保管庫: 写真の文字列→画像に戻せる', (()=>{ const b=dataURLToBlob('data:image/jpeg;base64,/9j/4AA=');
    return !!b && b.type==='image/jpeg' && b.size===5; })()]);
  T.push(['保管庫: 画像でない文字列は写真として戻さない', dataURLToBlob('{"x":1}')===null && dataURLToBlob('data:text/html;base64,PGI+')===null]);
  T.push(['保管庫: 形の違うデータは復元しない', !!validateBackupData({app:'other'}) &&
    !!validateBackupData({app:'dakoku',months:{'2026-06':{}}}) && !!validateBackupData({app:'dakoku',staff:{}}) &&
    !!validateBackupData({app:'dakoku',staff:[],months:{'2026-06':emptyMonthDoc()}}) &&   // 設定が欠けている＝PINを消さないよう拒否
    !!validateBackupData({app:'dakoku'}) &&                                                // 中身が空＝職員を消さないよう拒否
    !validateBackupData({app:'dakoku',settings:{},staff:[],months:{'2026-06':emptyMonthDoc()}})]);
  // localStorage ラウンドトリップ
  T.push(['保存: 月ドキュメントの読み書き一致', (()=>{ try{
    const k='__selftest'; const v={punches:[{id:'a'}],days:{},corrections:[],closed:null};
    lsSet(k,v); const r=lsGet(k,null); localStorage.removeItem(NS+k); return eq(r,v);
  }catch(e){ return false; } })()]);
  return T;
}
function renderSelfTests(){
  document.getElementById('mainView').classList.add('hidden');
  const el=document.getElementById('selftestView');
  el.classList.remove('hidden');
  const T=runSelfTests();
  const ok=T.filter(t=>t[1]).length;
  el.innerHTML=`<h2>セルフテスト ${ok}/${T.length} 合格</h2>
    <ol>${T.map(t=>`<li class="${t[1]?'t-ok':'t-ng'}">${t[1]?'✓':'✕'} ${t[0]}</li>`).join('')}</ol>
    <p><a href="./">打刻画面に戻る</a></p>`;
}

/* =========================================================================
   起動
   ========================================================================= */
function storageSelfCheck(){
  try{ localStorage.setItem(NS+'__probe','1'); localStorage.removeItem(NS+'__probe'); return true; }
  catch(e){ return false; }
}
async function boot(){
  if(location.search.includes('selftest=1')){ renderSelfTests(); return; }
  if(!storageSelfCheck()){
    document.body.innerHTML='<div style="padding:40px;font-size:18px;color:#c0392b">'+
      'このブラウザではデータを保存できません（プライベートブラウズ中の可能性）。<br>'+
      '通常モードのSafariで開き直してください。</div>';
    return;
  }
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  try{ await idbOpen(); photoPurge(settings.photo_retention_days); }catch(e){}
  // 院内保管庫：実データを読み込んだ後・写真DBを開いた後に作る（セルフテストでは上で return 済み＝作らない）
  // 検証用データ投入（?dev=1）の画面では作らない＝試験データを Mac mini に送らない
  // 検証用データを投入した端末（__devseeded）でも作らない
  const devSeeded=(()=>{ try{ return localStorage.getItem(NS+'__devseeded')==='1'; }catch(_){ return false; } })();
  try{ if(typeof createVault==='function' && !location.search.includes('dev=1') && !devSeeded) initVault(); }catch(e){ console.warn('院内保管庫の初期化に失敗',e); }
  // 管理画面への入口: ロゴ2秒長押し
  const logo=document.getElementById('logo');
  let pressTimer=null;
  const down=()=>{ pressTimer=setTimeout(()=>{ pressTimer=null; openAdmin(); },2000); };
  const up=()=>{ if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; } };
  logo.addEventListener('touchstart',down); logo.addEventListener('touchend',up);
  logo.addEventListener('mousedown',down); logo.addEventListener('mouseup',up); logo.addEventListener('mouseleave',up);
  tickClock(); setInterval(tickClock,1000);
  checkDrift(); setInterval(checkDrift,30*60*1000);
  renderGrid();
  camStart();
  if('serviceWorker' in navigator && location.protocol==='https:'){
    navigator.serviceWorker.register('sw.js?v='+APP_VERSION).catch(()=>{});
  }
}
boot();
</script>
