<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="打刻">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>勤怠打刻 - はた歯科医院</title>
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --ink:#1e2a32; --sub:#5b6b76;
  --accent:#0e7c86; --accent-ink:#ffffff; --line:#dde4e9;
  --ok:#1a9c6b; --warn:#c77f00; --err:#c0392b; --badge:#e74c3c;
  --dot-off:#d5dde3; --shadow:0 2px 8px rgba(20,40,60,.08);
  --tap-h:110px;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; }
body{ touch-action:manipulation; }
button{ font-family:inherit; }
.hidden{ display:none !important; }

/* ---------- メイン(待機)画面 ---------- */
#mainView{ min-height:100vh; display:flex; flex-direction:column; }
#mainHeader{ display:flex; align-items:center; gap:12px; padding:10px 16px;
  background:var(--card); border-bottom:1px solid var(--line); }
#logo{ font-weight:700; font-size:17px; color:var(--accent); user-select:none;
  -webkit-user-select:none; padding:8px 4px; }
#headClock{ margin-left:auto; text-align:right; }
#headDate{ font-size:13px; color:var(--sub); }
#headTime{ font-size:30px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1; }
#camWrap{ width:96px; height:72px; border-radius:8px; overflow:hidden; background:#222;
  position:relative; flex:none; }
#camVideo{ width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
#camState{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:10px; text-align:center; background:rgba(0,0,0,.55); padding:4px; }
#banner{ background:#fdecea; color:var(--err); font-size:14px; padding:8px 16px;
  border-bottom:1px solid #f5c6c0; }
#staffGrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:16px;
  align-content:start; flex:1; overflow-y:auto; }
.staffCard{ background:var(--card); border:1px solid var(--line); border-radius:14px;
  min-height:var(--tap-h); box-shadow:var(--shadow); padding:12px 14px; text-align:left;
  display:flex; flex-direction:column; justify-content:space-between; position:relative;
  user-select:none; -webkit-user-select:none; cursor:pointer; }
.staffCard:active{ background:#eaf4f5; }
.staffName{ font-size:22px; font-weight:700; }
.staffSub{ font-size:12px; color:var(--sub); margin-top:2px; }
.dots{ display:flex; gap:8px; margin-top:8px; align-items:center; }
.dot{ width:14px; height:14px; border-radius:50%; background:var(--dot-off); }
.dot.on{ background:var(--accent); }
.dotLbl{ font-size:10px; color:var(--sub); }
.cardBadge{ position:absolute; top:8px; right:10px; background:var(--badge); color:#fff;
  font-size:11px; border-radius:10px; padding:2px 8px; }
#emptyStaff{ grid-column:1/-1; text-align:center; color:var(--sub); padding:40px 20px; font-size:15px; }

/* ---------- トースト ---------- */
#toastWrap{ position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:8px; pointer-events:none; z-index:50; }
.toast{ background:var(--card); border:1px solid var(--line); border-left:6px solid var(--ok);
  border-radius:12px; box-shadow:0 4px 16px rgba(20,40,60,.18); padding:10px 14px;
  display:flex; align-items:center; gap:12px; pointer-events:auto; }
.toast.err{ border-left-color:var(--err); }
.toast img{ width:48px; height:36px; object-fit:cover; border-radius:6px; background:#ddd; }
.toastMsg{ font-size:17px; font-weight:600; flex:1; }
.toastMsg small{ display:block; font-size:12px; color:var(--sub); font-weight:400; }
.toast button{ border:1px solid var(--line); background:#f2f5f7; border-radius:9px;
  padding:10px 14px; font-size:14px; cursor:pointer; }
.typePanel{ background:var(--card); border:1px solid var(--line); border-radius:12px;
  box-shadow:0 4px 16px rgba(20,40,60,.18); padding:10px 14px; pointer-events:auto; }
.typePanel .tpTitle{ font-size:13px; color:var(--sub); margin-bottom:8px; }
.typePanel .tpBtns{ display:flex; flex-wrap:wrap; gap:8px; }
.typePanel button{ border:1px solid var(--line); background:#f2f5f7; border-radius:9px;
  padding:12px 16px; font-size:15px; cursor:pointer; }
.typePanel button.cur{ background:var(--accent); color:#fff; border-color:var(--accent); }

/* ---------- 管理画面 ---------- */
#adminView{ min-height:100vh; display:flex; flex-direction:column; }
#adminHeader{ display:flex; align-items:center; gap:10px; padding:10px 16px;
  background:var(--accent); color:#fff; }
#adminHeader h1{ font-size:16px; margin:0; font-weight:700; }
#adminHeader .sp{ flex:1; }
#adminHeader button{ background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.4);
  border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; }
#adminTabs{ display:flex; background:var(--card); border-bottom:1px solid var(--line); overflow-x:auto; }
#adminTabs button{ flex:1; border:none; background:none; padding:12px 8px; font-size:14px;
  color:var(--sub); border-bottom:3px solid transparent; cursor:pointer; white-space:nowrap; }
#adminTabs button.on{ color:var(--accent); border-bottom-color:var(--accent); font-weight:700; }
.adminBody{ padding:14px 16px 40px; flex:1; overflow:auto; }
.panel{ background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:14px 16px; margin-bottom:14px; box-shadow:var(--shadow); }
.panel h2{ font-size:15px; margin:0 0 10px; }
.small{ font-size:12px; color:var(--sub); }
.btn{ background:var(--accent); color:#fff; border:none; border-radius:9px;
  padding:11px 18px; font-size:15px; cursor:pointer; }
.btn.sec{ background:#eef2f4; color:var(--ink); border:1px solid var(--line); }
.btn.danger{ background:var(--err); }
.btn:disabled{ opacity:.45; cursor:default; }
input,select,textarea{ font-family:inherit; font-size:15px; padding:9px 10px;
  border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
textarea{ width:100%; }
label.f{ display:block; font-size:12px; color:var(--sub); margin:10px 0 4px; }
table.grid{ border-collapse:collapse; font-size:12px; }
table.grid th,table.grid td{ border:1px solid var(--line); padding:4px 5px; text-align:center;
  min-width:30px; }
table.grid th.name{ position:sticky; left:0; background:var(--card); text-align:left;
  min-width:80px; z-index:2; font-size:13px; }
table.grid td.cell{ cursor:pointer; }
table.grid td.cell:active{ background:#eaf4f5; }
td.ok{ color:var(--ok); } td.ng{ background:#fdecea; color:var(--err); font-weight:700; }
td.hol{ background:#f3f4f6; color:#b6bec5; } td.leave{ background:#fff6e0; }
.scrollX{ overflow-x:auto; }
ul.issues{ margin:6px 0; padding-left:0; list-style:none; }
ul.issues li{ padding:8px 10px; border:1px solid var(--line); border-radius:8px; margin-bottom:6px;
  font-size:13px; display:flex; gap:8px; align-items:flex-start; cursor:pointer; }
.fixBtns{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
.fixBtns button{ font-size:12px; padding:7px 10px; border-radius:7px; border:1px solid var(--accent);
  background:#eaf4f5; color:var(--accent); cursor:pointer; }
.fixBtns button:active{ background:var(--accent); color:#fff; }
ul.issues li .tag{ flex:none; font-size:11px; border-radius:6px; padding:2px 7px; color:#fff; }
.tag.block{ background:var(--err); } .tag.warn{ background:var(--warn); } .tag.info{ background:#7f8c9a; }
pre.csv{ background:#0f2530; color:#cfe8e5; font-size:12px; padding:12px; border-radius:8px;
  overflow:auto; max-height:300px; }

/* ---------- モーダル ---------- */
.modalBack{ position:fixed; inset:0; background:rgba(10,25,35,.45); z-index:100;
  display:flex; align-items:center; justify-content:center; padding:16px; }
.modal{ background:var(--card); border-radius:14px; padding:18px; width:100%;
  max-width:560px; max-height:88vh; overflow-y:auto; box-shadow:0 12px 40px rgba(0,0,0,.3); }
.modal h3{ margin:0 0 12px; font-size:16px; }
.pinDisp{ text-align:center; font-size:30px; letter-spacing:10px; min-height:44px;
  font-variant-numeric:tabular-nums; }
.pinPad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:280px; margin:10px auto; }
.pinPad button{ font-size:24px; padding:16px 0; border-radius:12px; border:1px solid var(--line);
  background:#f7f9fa; cursor:pointer; }
.pinMsg{ text-align:center; font-size:13px; color:var(--err); min-height:18px; }
.punchRow{ display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line);
  font-size:14px; flex-wrap:wrap; }
.punchRow img{ width:56px; height:42px; object-fit:cover; border-radius:6px; background:#ddd; cursor:pointer; }
.punchRow .noimg{ width:56px; height:42px; border-radius:6px; background:#eef1f3; color:#9aa7b0;
  font-size:10px; display:flex; align-items:center; justify-content:center; }
.punchRow.voided{ opacity:.45; text-decoration:line-through; }
.punchRow .mini{ font-size:11px; color:var(--sub); }
.punchRow select,.punchRow input{ font-size:13px; padding:5px 6px; }
.punchRow button{ font-size:12px; padding:6px 9px; border-radius:7px; border:1px solid var(--line);
  background:#f2f5f7; cursor:pointer; }
#photoModal img{ width:100%; border-radius:8px; }
.rowFlex{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }

/* selftest */
#selftestView{ padding:20px; font-size:14px; }
#selftestView .t-ok{ color:var(--ok); } #selftestView .t-ng{ color:var(--err); font-weight:700; }
@media (max-width:640px){ #staffGrid{ grid-template-columns:repeat(2,1fr); } }
</style>

<body>

<!-- ================= メイン（待機・打刻）画面 ================= -->
<div id="mainView">
  <div id="mainHeader">
    <div id="logo">はた歯科医院<br><span style="font-size:12px;color:var(--sub)">勤怠打刻</span></div>
    <div id="camWrap">
      <video id="camVideo" autoplay muted playsinline></video>
      <div id="camState" class="hidden"></div>
    </div>
    <div id="headClock">
      <div id="headDate">----年--月--日(-)</div>
      <div id="headTime">--:--</div>
    </div>
  </div>
  <div id="banner" class="hidden"></div>
  <div id="staffGrid"></div>
</div>

<!-- ================= 管理画面 ================= -->
<div id="adminView" class="hidden">
  <div id="adminHeader">
    <h1>管理画面（院長用）</h1>
    <div class="sp"></div>
    <button onclick="closeAdmin()">打刻画面に戻る</button>
  </div>
  <div id="adminTabs">
    <button data-tab="cal" class="on" onclick="adminTab('cal')">月次カレンダー</button>
    <button data-tab="issues" onclick="adminTab('issues')">異常一覧</button>
    <button data-tab="close" onclick="adminTab('close')">締め・CSV</button>
    <button data-tab="staff" onclick="adminTab('staff')">スタッフ</button>
    <button data-tab="settings" onclick="adminTab('settings')">設定</button>
  </div>
  <div class="adminBody" id="adminBody"></div>
</div>

<div id="toastWrap"></div>
<div id="modalRoot"></div>
<div id="selftestView" class="hidden"></div>

<script>
'use strict';
/* =========================================================================
   勤怠打刻アプリ（はた歯科医院） — 単一HTML・iPad Safari向け
   出力: 給与計算アプリ.html の勤怠CSVスキーマに完全準拠
   date,employee_id,clock_in,clock_out,break_minutes,leave_type,outing_minutes
   ========================================================================= */
const APP_VERSION = '1.0.0';
const DATA_SCHEMA = 1;
const NS = 'dakoku_';                       // 同一オリジン他アプリとのlocalStorage衝突回避
const UNDO_SECONDS = 10;                    // 打刻直後の取消可能時間
const DUP_GUARD_MIN = 3;                    // 同一人×同一種別の二重打刻ガード(分)
const DRIFT_LIMIT_SEC = 120;                // 時計ズレ警告閾値

const PUNCH_TYPES = {
  in:'出勤', bs:'休憩入', be:'休憩戻', os:'外出', oe:'戻り', out:'退勤'
};
const LEAVE_TYPES = {
  none:'（なし）', full_paid:'有給(終日)', half_paid_am:'半日有給(午前休)',
  half_paid_pm:'半日有給(午後休)', special_paid:'特別休暇(有給)',
  special_unpaid:'特別休暇(無給)', unpaid_leave:'無給休暇', absence:'欠勤'
};
const LEAVE_ABBR = {
  full_paid:'有', half_paid_am:'前', half_paid_pm:'後', special_paid:'特',
  special_unpaid:'特無', unpaid_leave:'無', absence:'欠'
};

/* =========================================================================
   医院カレンダー（給与計算アプリ.html L171-224 から移植・同一ロジック）
   ========================================================================= */
const DEFAULT_HOLIDAYS = [
 "2026-01-01","2026-01-12","2026-02-11","2026-02-23","2026-03-20","2026-04-29",
 "2026-05-03","2026-05-04","2026-05-05","2026-05-06","2026-07-20","2026-08-11",
 "2026-09-21","2026-09-22","2026-09-23","2026-10-12","2026-11-03","2026-11-23",
 "2027-01-01","2027-01-11","2027-02-11","2027-02-23","2027-03-21","2027-03-22",
 "2027-04-29","2027-05-03","2027-05-04","2027-05-05","2027-07-19","2027-08-11",
 "2027-09-20","2027-09-23","2027-10-11","2027-11-03","2027-11-23"
];
const SCHED = { // 曜日(0=日) → [始業分, 終業分, 休憩開始分, 休憩終了分] / nullは休
  1:[510,1020,750,810], 5:[510,1020,750,810],       // 月金 7h30m
  2:[510,1080,720,810], 3:[510,1080,720,810],       // 火水 8h00m
  6:[510,780,null,null]                              // 土 4h30m
};
const THU_SHORT=[510,720,null,null], THU_LONG=[510,1080,720,810];
function ymd(dstr){ const [y,m,d]=dstr.split('-').map(Number); return {y,m,d}; }
function dow(dstr){ const {y,m,d}=ymd(dstr); return new Date(Date.UTC(y,m-1,d)).getUTCDay(); }
function addDays(dstr,n){ const {y,m,d}=ymd(dstr); const t=new Date(Date.UTC(y,m-1,d+n));
  return t.toISOString().slice(0,10); }
function isSeasonal(dstr){ const {m,d}=ymd(dstr);
  return (m===8&&d>=13&&d<=15)||(m===12&&d>=30)||(m===1&&d<=3); }
function Calendar(settings){
  const holi = new Set(settings.holidays||DEFAULT_HOLIDAYS);
  const thuOv = settings.thursdayOverrides||{};   // {date:'normal'|'long'}
  const extraShotei = new Set(settings.extraShoteiHolidays||[]);
  function isNational(d){ return holi.has(d); }
  function isLegalHoliday(d){ return dow(d)===0; }          // 日曜
  function isShotei(d){ return isNational(d)||isSeasonal(d)||extraShotei.has(d); }
  function weekHasHoliday(d){
    let sun = addDays(d, -((dow(d)+7)%7));
    for(let i=0;i<7;i++) if(isNational(addDays(sun,i))) return true;
    return false;
  }
  function schedule(d){ // [start,end,bs,be] or null
    if(isLegalHoliday(d)||isShotei(d)) return null;
    const w = dow(d);
    if(w===4){ const ov=thuOv[d];
      if(ov==='normal') return THU_SHORT; if(ov==='long') return THU_LONG;
      return weekHasHoliday(d)?THU_LONG:THU_SHORT; }
    return SCHED[w]||null;
  }
  function workMin(sch){ if(!sch) return 0;
    let br = (sch[2]==null)?0:(sch[3]-sch[2]); return sch[1]-sch[0]-br; }
  function halfPaidAllowed(d){
    const sch=schedule(d); return sch!=null && sch[2]!=null; }
  return {isNational,isLegalHoliday,isShotei,schedule,workMin,halfPaidAllowed,weekHasHoliday};
}

/* =========================================================================
   ストレージ層（localStorage: dakoku_*）
   ========================================================================= */
function lsGet(key, fallback){
  try{ const v=localStorage.getItem(NS+key); return v?JSON.parse(v):fallback; }
  catch(e){ return fallback; }
}
function lsSet(key, val){ localStorage.setItem(NS+key, JSON.stringify(val)); }

const DEFAULT_SETTINGS = {
  schema:DATA_SCHEMA, pin_hash:null, pin_salt:null,
  photo_retention_days:90,
  holidays:DEFAULT_HOLIDAYS.slice(), thursdayOverrides:{}, extraShoteiHolidays:[]
};
let settings = Object.assign({}, DEFAULT_SETTINGS, lsGet('settings_v1', {}));
function saveSettings(){ lsSet('settings_v1', settings); cal = Calendar(settings); }
let cal = Calendar(settings);

let staff = lsGet('staff_v1', []);   // [{id,name,active,order}]
function saveStaff(){ lsSet('staff_v1', staff); }
function activeStaff(){ return staff.filter(s=>s.active).sort((a,b)=>(a.order-b.order)||(a.id-b.id)); }

function monthKeyOf(dstr){ return dstr.slice(0,7); }
function emptyMonthDoc(){ return {schema:DATA_SCHEMA, punches:[], days:{}, corrections:[], closed:null}; }
const monthCache = {};
function loadMonth(ym){
  if(!monthCache[ym]) monthCache[ym] = lsGet('m_'+ym+'_v1', null) || emptyMonthDoc();
  return monthCache[ym];
}
function saveMonth(ym){ lsSet('m_'+ym+'_v1', monthCache[ym]); }
function listMonthKeys(){
  const out=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
    const m=k && k.match(new RegExp('^'+NS+'m_(\\d{4}-\\d{2})_v1$')); if(m) out.push(m[1]); }
  return out.sort();
}

/* ---------- 時刻ユーティリティ ---------- */
function pad2(n){ return String(n).padStart(2,'0'); }
function todayStr(now){ const t=now||new Date();
  return `${t.getFullYear()}-${pad2(t.getMonth()+1)}-${pad2(t.getDate())}`; }
function nowHM(now){ const t=now||new Date(); return `${pad2(t.getHours())}:${pad2(t.getMinutes())}`; }
function hmToMin(hm){ if(!hm) return null; const [h,m]=hm.split(':').map(Number); return h*60+m; }
function minToHM(min){ return `${pad2(Math.floor(min/60))}:${pad2(min%60)}`; }
function lastDayOf(ym){ const [y,m]=ym.split('-').map(Number); return new Date(Date.UTC(y,m,0)).getUTCDate(); }
function genId(){ return 'p_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* =========================================================================
   打刻コアロジック（純関数群 — selftestから直接テストする）
   ========================================================================= */
function validPunches(doc, sid, dstr){
  return doc.punches.filter(p=>p.sid===sid && p.d===dstr && !p.void)
    .sort((a,b)=>hmToMin(a.t)-hmToMin(b.t) || a.at-b.at);
}
// 次に押すべき打刻種別の推定
function nextType(doc, sid, dstr, calendar){
  const ps = validPunches(doc, sid, dstr);
  const has = ty => ps.some(p=>p.ty===ty);
  const sch = (calendar||cal).schedule(dstr);
  const seq = (sch && sch[2]!=null) ? ['in','bs','be','out'] : ['in','out'];
  for(const ty of seq){ if(!has(ty)) return ty; }
  return null; // 退勤済み
}
// 二重打刻ガード: 同一人×同一種別がN分以内なら既存打刻を返す
function findDup(doc, sid, dstr, ty, hm){
  const t = hmToMin(hm);
  return validPunches(doc, sid, dstr).find(p=>p.ty===ty && Math.abs(hmToMin(p.t)-t)<DUP_GUARD_MIN);
}
// ペア合計(分): 開始種別→終了種別を時刻順に結合
function pairSum(ps, startTy, endTy){
  const ev = ps.filter(p=>p.ty===startTy||p.ty===endTy);
  let total=0, open=null;
  for(const p of ev){
    if(p.ty===startTy){ if(open==null) open=hmToMin(p.t); }
    else { if(open!=null){ total+=Math.max(0,hmToMin(p.t)-open); open=null; } }
  }
  return total;
}
function dayLeave(doc, sid, dstr){
  const rec = doc.days[sid+'|'+dstr]; return (rec && rec.leave) || 'none';
}

/* ---------- 月次 → CSV行生成（給与計算アプリの取込スキーマ完全準拠） ---------- */
function buildMonthRows(staffList, doc, ym){
  const last = lastDayOf(ym);
  const rows = [];
  const sids = staffList.slice().sort((a,b)=>a.id-b.id);
  for(const s of sids){
    for(let d=1; d<=last; d++){
      const dstr = ym+'-'+pad2(d);
      if(monthKeyOf(dstr)!==ym) continue;            // 月外行はエンジン側バグを踏むため二重防御
      const ps = validPunches(doc, s.id, dstr);
      const leave = dayLeave(doc, s.id, dstr);
      if(!ps.length && leave==='none') continue;
      const ins = ps.filter(p=>p.ty==='in'), outs = ps.filter(p=>p.ty==='out');
      const cin = ins.length ? ins.map(p=>p.t).sort()[0] : '';
      const cout = outs.length ? outs.map(p=>p.t).sort().slice(-1)[0] : '';
      rows.push([dstr, s.id, cin, cout, pairSum(ps,'bs','be'), leave, pairSum(ps,'os','oe')]);
    }
  }
  return rows;
}
function rowsToCSV(rows){

  return head + '\n' + rows.map(r=>r.join(',')).join('\n') + '\n';

/* ---------- 月次検証（締めブロック/警告。管理画面の異常一覧と共用） ----------
   full=true: 月の全日を対象(締め時) / false: 今日より前のみ(日常の異常一覧) */
function validateMonth(staffList, doc, ym, calendar, opts){
  const C = calendar||cal;
  const full = opts && opts.full;
  const today = todayStr();
  const last = lastDayOf(ym);
  const blocks=[], warns=[], infos=[];
  const B=(sid,d,msg,fix)=>blocks.push({sid,d,msg,fix});
  const W=(sid,d,msg,fix)=>warns.push({sid,d,msg,fix});
  const I=(sid,d,msg)=>infos.push({sid,d,msg});
  for(const s of staffList){
    // 月内に打刻も休暇入力も一切ないスタッフは日別ブロックにせず警告1件（月途中入社・退職対応）
    const anyData = doc.punches.some(p=>p.sid===s.id && !p.void && monthKeyOf(p.d)===ym) ||
      Object.keys(doc.days).some(k=>k.startsWith(s.id+'|'));
    if(!anyData){
      W(s.id, ym+'-01', 'この月のデータが1件もありません（この月に在籍していなければそのままでOK。在籍していた場合は打刻/休暇を入力）');
      continue;
    }
    for(let dd=1; dd<=last; dd++){
      const dstr = ym+'-'+pad2(dd);
      if(!full && dstr>=today) continue;             // 未来日と当日は日常表示では対象外
      if(full && dstr>=today && dstr>today) continue; // 締めでも未来日は対象外(当月途中締め対策)
      const ps = validPunches(doc, s.id, dstr);
      const leave = dayLeave(doc, s.id, dstr);
      const sch = C.schedule(dstr);
      const fullDayLeave = ['full_paid','special_paid','special_unpaid','unpaid_leave','absence'].includes(leave);
      // 8. 給与エンジンが取込エラーにするデータを先にブロック
      if(!sch && leave!=='none'){ B(s.id,dstr,`休日に休暇区分(${LEAVE_TYPES[leave]})が入っています`); continue; }
      if((leave==='half_paid_am'||leave==='half_paid_pm') && !C.halfPaidAllowed(dstr)){
        B(s.id,dstr,'半日有給は月火水金と祝日週の木曜のみ設定できます'); continue; }
      // 4. 所定日に打刻も休暇区分もない → 満額払いになるためブロック
      if(sch && !ps.length && leave==='none'){ B(s.id,dstr,'打刻も休暇区分もありません','noData'); continue; }
      if(!ps.length) continue;
      const has = ty => ps.filter(p=>p.ty===ty);
      const ins=has('in'), outs=has('out');
      // 1-2. 出勤/退勤の欠落・順序異常
      if(ins.length && !outs.length){ B(s.id,dstr,'退勤打刻がありません', sch?'noOut':null); }
      if(!ins.length && outs.length){ B(s.id,dstr,'出勤打刻がありません（退勤のみ）', sch?'noIn':null); }
      if(ins.length && outs.length){
        const cin=hmToMin(ins.map(p=>p.t).sort()[0]);
        const cout=hmToMin(outs.map(p=>p.t).sort().slice(-1)[0]);
        if(cout<=cin) B(s.id,dstr,'退勤時刻が出勤時刻より前です');
        for(const p of ps){ const t=hmToMin(p.t);
          if(p.ty!=='in'&&p.ty!=='out'&&(t<cin||t>cout)){ B(s.id,dstr,`${PUNCH_TYPES[p.ty]}(${p.t})が勤務時間外です`); break; } }
      }
      // 3. ペア不成立
      for(const [a,b,lbl] of [['bs','be','休憩'],['os','oe','外出']]){
        const ev=ps.filter(p=>p.ty===a||p.ty===b); let open=0,bad=false;
        for(const p of ev){ if(p.ty===a){ if(open){bad=true;break;} open=1; } else { if(!open){bad=true;break;} open=0; } }
        if(bad||open) B(s.id,dstr,`${lbl}の打刻ペアが揃っていません（${lbl}入/${lbl}戻の対応を確認）`);
      }
      // 5. 同種別重複
      if(ins.length>1) W(s.id,dstr,`出勤が${ins.length}回打刻（最も早い時刻を採用）`);
      if(outs.length>1) W(s.id,dstr,`退勤が${outs.length}回打刻（最も遅い時刻を採用）`);
      // 6. 休憩ありの所定日で休憩打刻なし（半休日は昼休憩を挟まない勤務が正常のため除外）
      const halfDay = leave==='half_paid_am'||leave==='half_paid_pm';
      if(sch && sch[2]!=null && !fullDayLeave && !halfDay && ins.length && outs.length && !has('bs').length){
        W(s.id,dstr,'休憩打刻がありません（実働が過大→残業誤計算の恐れ）','noBreak'); }
      // 7. 所定休日出勤はエンジン非集計
      if(!sch && !C.isLegalHoliday(dstr) && ps.length){
        W(s.id,dstr,'祝日等の出勤は給与エンジンで自動集計されません（給与アプリで手入力対応）'); }
      // 9. 写真なし
      for(const p of ps){ if(p.src==='tap' && !p.ph) I(s.id,dstr,`${PUNCH_TYPES[p.ty]} ${p.t} の写真がありません`); }
    }
  }
  return {blocks, warns, infos};
}

/* ---------- 所定時刻（押し忘れ自動補完用。半休は勤務すべき半日に合わせる） ---------- */
function scheduledTimes(dstr, leave, calendar){
  const sch=(calendar||cal).schedule(dstr); if(!sch) return null;
  let start=sch[0], end=sch[1];
  if(leave==='half_paid_am') start=sch[3];   // 午前休→休憩明けから勤務
  if(leave==='half_paid_pm') end=sch[2];     // 午後休→休憩前まで勤務
  const hasBreak = sch[2]!=null && leave!=='half_paid_am' && leave!=='half_paid_pm';
  return {in:minToHM(start), out:minToHM(end),
    bs:hasBreak?minToHM(sch[2]):null, be:hasBreak?minToHM(sch[3]):null};
}

/* ---------- ワンタップ修正（異常一覧・締め画面の「要修正」から） ---------- */
const FIX_BTNS = {
  noData:[['absence','欠勤にする'],['full_paid','有給にする'],['fillDay','押し忘れ→所定時刻で打刻']],
  noOut:[['fillOut','押し忘れ→所定退勤を追加']],
  noIn:[['fillIn','押し忘れ→所定出勤を追加']],
  noBreak:[['fillBreak','所定休憩を追加']]
};
function quickFix(sid, dstr, action){
  const ym=monthKeyOf(dstr), doc=loadMonth(ym);
  const leave=dayLeave(doc,sid,dstr);
  const st=scheduledTimes(dstr, leave);
  const addP=(ty,t,note)=>{
    addCorrection(ym,{kind:'add',sid,d:dstr,before:null,after:{ty,t},note});
    doc.punches.push({id:genId(),sid,d:dstr,t,ty,at:Date.now(),src:'admin',ph:0,void:0,void_by:null});
  };
  if(action==='absence'||action==='full_paid'){
    addCorrection(ym,{kind:'leave',sid,d:dstr,before:{leave},after:{leave:action},note:'一覧からワンタップ修正'});
    doc.days[sid+'|'+dstr]={leave:action};
  } else if(action==='fillDay' && st){
    addP('in',st.in,'押し忘れ→所定時刻で自動補完');
    if(st.bs){ addP('bs',st.bs,'押し忘れ→所定時刻で自動補完'); addP('be',st.be,'押し忘れ→所定時刻で自動補完'); }
    addP('out',st.out,'押し忘れ→所定時刻で自動補完');
  } else if(action==='fillOut' && st){ addP('out',st.out,'退勤押し忘れ→所定時刻で自動補完');
  } else if(action==='fillIn' && st){ addP('in',st.in,'出勤押し忘れ→所定時刻で自動補完');
  } else if(action==='fillBreak' && st && st.bs){
    addP('bs',st.bs,'休憩打刻なし→所定時刻で自動補完'); addP('be',st.be,'休憩打刻なし→所定時刻で自動補完');
  }
  saveMonth(ym);
  adminTab(currentTab);
}

/* =========================================================================
   IndexedDB（写真のみ・端末外に出さない）
   ========================================================================= */
let idb = null;
function idbOpen(){
  return new Promise((res,rej)=>{
    const rq = indexedDB.open('dakoku_photos_v1', 1);
    rq.onupgradeneeded = e=>{
      const db=e.target.result;
      const st=db.createObjectStore('photos',{keyPath:'punch_id'});
      st.createIndex('at','at');
    };
    rq.onsuccess = e=>{ idb=e.target.result; res(idb); };
    rq.onerror = ()=>rej(rq.error);
  });
}
function photoPut(rec){
  return new Promise((res,rej)=>{ if(!idb) return res(false);
    const tx=idb.transaction('photos','readwrite');
    tx.objectStore('photos').put(rec); tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error); });
}
function photoGet(punchId){
  return new Promise((res)=>{ if(!idb) return res(null);
    const rq=idb.transaction('photos').objectStore('photos').get(punchId);
    rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>res(null); });
}
function photoPurge(retentionDays){
  return new Promise((res)=>{ if(!idb) return res(0);
    const limit = Date.now() - retentionDays*24*3600*1000;
    const idx = idb.transaction('photos','readwrite').objectStore('photos').index('at');
    let n=0;
    idx.openCursor(IDBKeyRange.upperBound(limit)).onsuccess = e=>{
      const c=e.target.result; if(c){ c.delete(); n++; c.continue(); } else res(n); };
  });
}

/* =========================================================================
   カメラ（常時プレビュー・タップ瞬間キャプチャ）
   ========================================================================= */
const cam = { stream:null, ok:false };
async function camStart(){
  const v = document.getElementById('camVideo');
  const stateEl = document.getElementById('camState');
  try{
    if(cam.stream) cam.stream.getTracks().forEach(t=>t.stop());
    cam.stream = await navigator.mediaDevices.getUserMedia(
      {video:{facingMode:'user', width:{ideal:640}, height:{ideal:480}}, audio:false});
    v.srcObject = cam.stream; await v.play().catch(()=>{});
    cam.ok = true; stateEl.classList.add('hidden');
  }catch(e){
    cam.ok = false; stateEl.textContent = 'カメラ未使用\n(打刻は可能)';
    stateEl.classList.remove('hidden');
  }
}
function camCapture(){ // JPEG 480x360 Blob（失敗時 null）
  return new Promise((res)=>{
    try{
      const v = document.getElementById('camVideo');
      if(!cam.ok || !v.videoWidth) return res(null);
      const cw=480, ch=360, c=document.createElement('canvas');
      c.width=cw; c.height=ch;
      const ctx=c.getContext('2d');
      const scale=Math.max(cw/v.videoWidth, ch/v.videoHeight);
      const sw=cw/scale, sh=ch/scale;
      ctx.drawImage(v,(v.videoWidth-sw)/2,(v.videoHeight-sh)/2,sw,sh,0,0,cw,ch);
      c.toBlob(b=>res(b),'image/jpeg',0.7);
    }catch(e){ res(null); }
  });
}

  if(!document.hidden && !document.getElementById('adminView').matches(':not(.hidden)')) camStart();

async function doPunch(sid){
  const now = new Date();
  const dstr = todayStr(now), hm = nowHM(now);
  const ym = monthKeyOf(dstr);
  const doc = loadMonth(ym);
  const s = staff.find(x=>x.id===sid);
  let ty = nextType(doc, sid, dstr);
  if(ty===null){ // 退勤済み → 打刻せず種別選択を出す
    showToast({err:true, msg:`${s.name}さんは本日退勤済みです`, sub:'必要なら下の種別を選んで打刻してください',
      chooseOnly:true, sid, dstr});
    return;
  }
  const dup = findDup(doc, sid, dstr, ty, hm);
  if(dup){
    showToast({err:true, msg:`${s.name}さん ${PUNCH_TYPES[ty]}は ${dup.t} に打刻済みです`,
      sub:'別の種別で打刻する場合は下から選んでください', chooseOnly:true, sid, dstr});
    return;
  }
  const blob = await camCapture(); // 打刻より先にフレーム確保（ゼロ遅延）
  const p = {id:genId(), sid, d:dstr, t:hm, ty, at:now.getTime(), src:'tap', ph:0, void:0, void_by:null};
  doc.punches.push(p); saveMonth(ym);          // 打刻データを先に確定保存
  renderGrid();
  if(blob){
    photoPut({punch_id:p.id, sid, at:p.at, blob}).then(()=>{
      p.ph=1; saveMonth(ym);
      const img=document.querySelector(`[data-toastimg="${p.id}"]`);
      if(img) blobToImg(blob, img);
    }).catch(()=>{});
  }
  showToast({msg:`${s.name}さん ${PUNCH_TYPES[ty]} ${hm} ✓`, sub:'間違えたら「取消」か種別を変更（10秒間）',
    punch:p, ym, blob});
}
function blobToImg(blob, img){ const u=URL.createObjectURL(blob); img.onload=()=>URL.revokeObjectURL(u); img.src=u; }

let toastTimer=null;
function showToast(o){
  const wrap = document.getElementById('toastWrap');
  wrap.innerHTML='';
  if(toastTimer){ clearInterval(toastTimer); toastTimer=null; }
  const t = document.createElement('div');
  t.className='toast'+(o.err?' err':'');
  let inner = '';
  if(o.punch) inner += `<img data-toastimg="${o.punch.id}" alt="">`;
  inner += `<div class="toastMsg">${o.msg}<small>${o.sub||''}</small></div>`;
  if(o.punch) inner += `<button data-undo>取消 <span data-cnt>${UNDO_SECONDS}</span></button>`;
  t.innerHTML = inner;
  wrap.appendChild(t);
  // 種別変更/選択パネル
  const panel = document.createElement('div');
  panel.className='typePanel';
  panel.innerHTML = `<div class="tpTitle">${o.chooseOnly?'種別を選んで打刻:':'種別を変更:'}</div>
    <div class="tpBtns">${Object.entries(PUNCH_TYPES).map(([k,v])=>
      `<button data-ty="${k}" class="${o.punch&&o.punch.ty===k?'cur':''}">${v}</button>`).join('')}</div>`;
  wrap.appendChild(panel);
  if(o.punch && o.blob){ const img=t.querySelector(`[data-toastimg="${o.punch.id}"]`); if(img) blobToImg(o.blob,img); }
  const clearAll = ()=>{ wrap.innerHTML=''; if(toastTimer){clearInterval(toastTimer);toastTimer=null;} };
  panel.querySelectorAll('[data-ty]').forEach(b=>{
    b.onclick = ()=>{
      const ty=b.dataset.ty;
      if(o.chooseOnly){ punchWithType(o.sid, ty); return; } // punchWithType側のトーストが置き換える
      const doc=loadMonth(o.ym);
      const p=doc.punches.find(x=>x.id===o.punch.id);
      if(p){ p.ty=ty; saveMonth(o.ym); renderGrid(); }
      panel.querySelectorAll('button').forEach(x=>x.classList.toggle('cur',x.dataset.ty===ty));
      t.querySelector('.toastMsg').firstChild.textContent =
        `${staff.find(x=>x.id===p.sid).name}さん ${PUNCH_TYPES[ty]} ${p.t} ✓`;
    };
  });
  const undoBtn = t.querySelector('[data-undo]');
  if(undoBtn) undoBtn.onclick = ()=>{
    const doc=loadMonth(o.ym);
    const p=doc.punches.find(x=>x.id===o.punch.id);
    if(p){ p.void=1; p.void_by='self'; saveMonth(o.ym); renderGrid(); }
    clearAll();
  };
  let left = UNDO_SECONDS;
  toastTimer = setInterval(()=>{
    left--;
    const c=t.querySelector('[data-cnt]'); if(c) c.textContent=left;
    if(left<=0) clearAll();
  },1000);
}
async function punchWithType(sid, ty){ // 種別指定打刻（退勤済み後の例外・外出/戻り等）
  const now=new Date(); const dstr=todayStr(now), hm=nowHM(now), ym=monthKeyOf(dstr);
  const doc=loadMonth(ym);
  const s=staff.find(x=>x.id===sid);
  const dup=findDup(doc,sid,dstr,ty,hm);
  if(dup){ showToast({err:true,msg:`${s.name}さん ${PUNCH_TYPES[ty]}は ${dup.t} に打刻済みです`}); return; }
  const blob=await camCapture();
  const p={id:genId(),sid,d:dstr,t:hm,ty,at:now.getTime(),src:'tap',ph:0,void:0,void_by:null};
  doc.punches.push(p); saveMonth(ym); renderGrid();
  if(blob){ photoPut({punch_id:p.id,sid,at:p.at,blob}).then(()=>{ p.ph=1; saveMonth(ym); }); }
  showToast({msg:`${s.name}さん ${PUNCH_TYPES[ty]} ${hm} ✓`, sub:'間違えたら「取消」（10秒間）', punch:p, ym, blob});
}

      else if(n==='OK'){
        const lock=pinLock();
        if(Date.now()<lock.until){ msg.textContent=`ロック中です（${Math.ceil((lock.until-Date.now())/1000)}秒後に再試行）`; return; }
        const r = await onOK(entered);
        if(r!==true){ entered=''; disp.textContent='';
          const l=pinLock(); l.n++;
          if(l.n>=5){ l.until=Date.now()+60000; l.n=0; msg.textContent='5回失敗。60秒間ロックします'; }
          else msg.textContent=r||'PINが違います';
          savePinLock(l); return; }
        savePinLock({n:0,until:0});
        return;
      }
      else if(entered.length<6) entered+=n;
      disp.textContent='●'.repeat(entered.length);
    };
  });
}

function openAdmin(){
  if(!settings.pin_hash){ openPinSetup(); return; }
  openPinPad('管理PINを入力', async pin=>{
    if(pin.length<4) return 'PINは4桁以上です';
    const h = await sha256hex(settings.pin_salt + pin);
    if(h!==settings.pin_hash) return 'PINが違います';
    closeModal(); showAdmin(); return true;
  });
}
function openPinSetup(){
  let first=null;
  openPinPad('管理PINを設定（4〜6桁）', async pin=>{
    if(pin.length<4) return '4桁以上で設定してください';
    if(first===null){ first=pin; document.getElementById('pinMsg').textContent='確認のためもう一度入力してください';
      document.getElementById('pinDisp').textContent=''; return '確認のためもう一度入力'; }
    if(pin!==first){ first=null; return '一致しません。最初からやり直してください'; }
    settings.pin_salt = [...crypto.getRandomValues(new Uint8Array(8))].map(b=>b.toString(16).padStart(2,'0')).join('');
    settings.pin_hash = await sha256hex(settings.pin_salt + pin);
    saveSettings(); closeModal(); showAdmin(); return true;
  });
}

        `<option value="${k}" ${p.ty===k?'selected':''}>${v}</option>`).join('')}</select>

    <h3>${esc(s?s.name:('ID'+sid))} — ${dstr}（${WEEK[dow(dstr)]}）${sch?'':' 【休診日】'}</h3>
    <div class="small">所定: ${sch?`${minToHM(sch[0])}〜${minToHM(sch[1])}${sch[2]!=null?` 休憩${minToHM(sch[2])}〜${minToHM(sch[3])}`:'（休憩なし）'}`:'なし'}</div>

        <select id="addTy">${Object.entries(PUNCH_TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
        <input type="time" id="addT"></div>
      <button class="btn sec" id="addBtn">追加</button>
    </div>
    <div class="rowFlex" style="margin-top:12px">
      <div><label class="f">休暇区分</label>
        <select id="leaveSel">${Object.entries(LEAVE_TYPES).map(([k,v])=>
          `<option value="${k}" ${leave===k?'selected':''}>${v}</option>`).join('')}</select></div>
      <div style="flex:1"><label class="f">修正メモ（任意・履歴に残ります）</label>
        <input id="noteInp" style="width:100%" placeholder="例: 本人申告により追加"></div>
    </div>
    <div id="dayMsg" class="pinMsg" style="text-align:left;margin-top:8px"></div>
    <div style="margin-top:14px;display:flex;gap:10px;justify-content:flex-end">
      <button class="btn sec" onclick="closeModal()">閉じる</button>
      <button class="btn" id="saveDay">変更を保存</button>
    </div>
  </div></div>`;
  // 写真サムネ読込
  for(const p of ps){ if(!p.ph) continue;
    photoGet(p.id).then(rec=>{
      const el=root.querySelector(`[data-photo="${p.id}"]`);
      if(!el) return;
      if(!rec){ el.textContent='写真なし'; return; }
      const img=document.createElement('img');
      blobToImg(rec.blob,img);
      img.onclick=()=>openPhotoModal(rec.blob, `${esc(s?s.name:'')} ${dstr} ${p.t}`);
      el.replaceWith(img); img.dataset.photo=p.id;
    });
  }
  const note = ()=>root.querySelector('#noteInp').value.trim();
  // 個別ボタン（取消・再分類）は即時反映＋履歴
  root.querySelectorAll('[data-void]').forEach(b=>{
    b.onclick=()=>{
      const pid=b.closest('.punchRow').dataset.pid;
      const p=doc.punches.find(x=>x.id===pid);
      addCorrection(ym,{kind:'void',sid,d:dstr,before:{ty:p.ty,t:p.t},after:null,note:note()});

    };
  });
  root.querySelectorAll('[data-reclass]').forEach(b=>{
    b.onclick=()=>{
      const pid=b.closest('.punchRow').dataset.pid;
      const p=doc.punches.find(x=>x.id===pid);
      const map={bs:'os',os:'bs',be:'oe',oe:'be'};
      addCorrection(ym,{kind:'reclass',sid,d:dstr,before:{ty:p.ty,t:p.t},after:{ty:map[p.ty],t:p.t},note:note()});
      p.ty=map[p.ty]; saveMonth(ym); openDayEditor(sid,dstr);

    saveMonth(ym); openDayEditor(sid,dstr);

  root.querySelector('#saveDay').onclick=()=>{

    root.querySelectorAll('.punchRow').forEach(row=>{
      const pid=row.dataset.pid; if(!pid) return;
      const p=doc.punches.find(x=>x.id===pid); if(!p||p.void) return;
      const nt=row.querySelector('[data-edit-t]').value, nty=row.querySelector('[data-edit-ty]').value;

        if(nt!==p.t||nty!==p.ty){
          addCorrection(ym,{kind:'edit',sid,d:dstr,before:{ty:p.ty,t:p.t},after:{ty:nty,t:nt},note:note()});
          p.t=nt; p.ty=nty;
        }
      }
    });
    // 休暇区分
    const nl=root.querySelector('#leaveSel').value;
    if(nl!==leave){
      if((nl==='half_paid_am'||nl==='half_paid_pm') && !cal.halfPaidAllowed(dstr)){
        root.querySelector('#dayMsg').textContent='半日有給は月火水金と祝日週の木曜のみ設定できます'; return; }
      if(nl!=='none' && !cal.schedule(dstr)){
        root.querySelector('#dayMsg').textContent='休診日に休暇区分は設定できません（給与取込エラーになります）'; return; }
      addCorrection(ym,{kind:'leave',sid,d:dstr,before:{leave},after:{leave:nl},note:note()});
      if(nl==='none') delete doc.days[sid+'|'+dstr];
      else doc.days[sid+'|'+dstr]={leave:nl};
    }
    saveMonth(ym); closeModal();
    if(currentTab) adminTab(currentTab);
  };
}

function exportCSV(mode){
  const ym=closeYM, doc=loadMonth(ym);

  if(mode==='copy'){
    navigator.clipboard.writeText(csv).then(()=>alert('コピーしました'),()=>alert('コピーできませんでした'));
    return;
  }
  const file=new File([csv], fname, {type:'text/csv'});
  if(mode==='share' && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file], title:fname}).catch(()=>{});
    return;
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=fname;
  document.body.appendChild(a); a.click(); a.remove();

function importBackup(inp){
  const f=inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(d.app!=='dakoku') throw Error('このアプリのバックアップではありません');
      if(!confirm(`${d.exported_at} のバックアップで現在のデータを置き換えます。よろしいですか？`)) return;

    }catch(e){ alert('復元に失敗: '+e.message); }
  };
  rd.readAsText(f);
}

function seedDocFromCSV(csvText){ // CSV → 打刻ドキュメント（selftest/devSeed共用の純関数）
  const doc=emptyMonthDoc();
  const lines=csvText.trim().split('\n'); lines.shift();
  for(const line of lines){
    const [d,idStr,ci,co,brStr,leave,outStr]=line.split(',');
    const sid=+idStr, br=+brStr, outing=+outStr;
    const at=Date.parse(d+'T00:00:00');
    const push=(ty,t)=>doc.punches.push({id:genId(),sid,d,t,ty,at,src:'tap',ph:0,void:0,void_by:null});
    if(ci) push('in',ci);
    if(co) push('out',co);
    if(br===60){ push('bs','12:30'); push('be','13:30'); }
    else if(br===90){ push('bs','12:00'); push('be','13:30'); }
    else if(br>0){ push('bs','12:30'); push('be',minToHM(750+br)); }
    if(outing>0){ push('os','15:00'); push('oe',minToHM(900+outing)); }
    if(leave && leave!=='none') doc.days[sid+'|'+d]={leave};
  }
  return doc;
}

function storageSelfCheck(){
  try{ localStorage.setItem(NS+'__probe','1'); localStorage.removeItem(NS+'__probe'); return true; }
  catch(e){ return false; }
}
async function boot(){
  if(location.search.includes('selftest=1')){ renderSelfTests(); return; }
  if(!storageSelfCheck()){
    document.body.innerHTML='<div style="padding:40px;font-size:18px;color:#c0392b">'+
      'このブラウザではデータを保存できません（プライベートブラウズ中の可能性）。<br>'+
      '通常モードのSafariで開き直してください。</div>';
    return;
  }
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  try{ await idbOpen(); photoPurge(settings.photo_retention_days); }catch(e){}
  // 管理画面への入口: ロゴ2秒長押し
  const logo=document.getElementById('logo');
  let pressTimer=null;
  const down=()=>{ pressTimer=setTimeout(()=>{ pressTimer=null; openAdmin(); },2000); };
  const up=()=>{ if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; } };
  logo.addEventListener('touchstart',down); logo.addEventListener('touchend',up);
  logo.addEventListener('mousedown',down); logo.addEventListener('mouseup',up); logo.addEventListener('mouseleave',up);
  tickClock(); setInterval(tickClock,1000);
  checkDrift(); setInterval(checkDrift,30*60*1000);
  renderGrid();
  camStart();
  if('serviceWorker' in navigator && location.protocol==='https:'){
    navigator.serviceWorker.register('sw.js?v='+APP_VERSION).catch(()=>{});
  }
}
boot();
</script>
