<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="打刻">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>勤怠打刻 - はた歯科医院</title>
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --ink:#1e2a32; --sub:#5b6b76;
  --accent:#0e7c86; --accent-ink:#ffffff; --line:#dde4e9;
  --ok:#1a9c6b; --warn:#c77f00; --err:#c0392b; --badge:#e74c3c;
  --dot-off:#d5dde3; --shadow:0 2px 8px rgba(20,40,60,.08);
  --tap-h:110px;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; }
body{ touch-action:manipulation; }
button{ font-family:inherit; }
.hidden{ display:none !important; }

/* ---------- メイン(待機)画面 ---------- */
#mainView{ min-height:100vh; display:flex; flex-direction:column; }
#mainHeader{ display:flex; align-items:center; gap:12px; padding:10px 16px;
  background:var(--card); border-bottom:1px solid var(--line); }
#logo{ font-weight:700; font-size:17px; color:var(--accent); user-select:none;
  -webkit-user-select:none; padding:8px 4px; }
#headClock{ margin-left:auto; text-align:right; }
#headDate{ font-size:13px; color:var(--sub); }
#headTime{ font-size:30px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1; }
#camWrap{ width:96px; height:72px; border-radius:8px; overflow:hidden; background:#222;
  position:relative; flex:none; }
#camVideo{ width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
#camState{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:10px; text-align:center; background:rgba(0,0,0,.55); padding:4px; }
#banner{ background:#fdecea; color:var(--err); font-size:14px; padding:8px 16px;
  border-bottom:1px solid #f5c6c0; }
#staffGrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:16px;
  align-content:start; flex:1; overflow-y:auto; }
.staffCard{ background:var(--card); border:1px solid var(--line); border-radius:14px;
  min-height:var(--tap-h); box-shadow:var(--shadow); padding:12px 14px; text-align:left;
  display:flex; flex-direction:column; justify-content:space-between; position:relative;
  user-select:none; -webkit-user-select:none; cursor:pointer; }
.staffCard:active{ background:#eaf4f5; }
.staffName{ font-size:22px; font-weight:700; }
.staffSub{ font-size:12px; color:var(--sub); margin-top:2px; }
.dots{ display:flex; gap:8px; margin-top:8px; align-items:center; }
.dot{ width:14px; height:14px; border-radius:50%; background:var(--dot-off); }
.dot.on{ background:var(--accent); }
.dotLbl{ font-size:10px; color:var(--sub); }
.cardBadge{ position:absolute; top:8px; right:10px; background:var(--badge); color:#fff;
  font-size:11px; border-radius:10px; padding:2px 8px; }
#emptyStaff{ grid-column:1/-1; text-align:center; color:var(--sub); padding:40px 20px; font-size:15px; }

/* ---------- トースト ---------- */
#toastWrap{ position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:8px; pointer-events:none; z-index:50; }
.toast{ background:var(--card); border:1px solid var(--line); border-left:6px solid var(--ok);
  border-radius:12px; box-shadow:0 4px 16px rgba(20,40,60,.18); padding:10px 14px;
  display:flex; align-items:center; gap:12px; pointer-events:auto; }
.toast.err{ border-left-color:var(--err); }
.toast img{ width:48px; height:36px; object-fit:cover; border-radius:6px; background:#ddd; }
.toastMsg{ font-size:17px; font-weight:600; flex:1; }
.toastMsg small{ display:block; font-size:12px; color:var(--sub); font-weight:400; }
.toast button{ border:1px solid var(--line); background:#f2f5f7; border-radius:9px;
  padding:10px 14px; font-size:14px; cursor:pointer; }
.typePanel{ background:var(--card); border:1px solid var(--line); border-radius:12px;
  box-shadow:0 4px 16px rgba(20,40,60,.18); padding:10px 14px; pointer-events:auto; }
.typePanel .tpTitle{ font-size:13px; color:var(--sub); margin-bottom:8px; }
.typePanel .tpBtns{ display:flex; flex-wrap:wrap; gap:8px; }
.typePanel button{ border:1px solid var(--line); background:#f2f5f7; border-radius:9px;
  padding:12px 16px; font-size:15px; cursor:pointer; }
.typePanel button.cur{ background:var(--accent); color:#fff; border-color:var(--accent); }

/* ---------- 管理画面 ---------- */
#adminView{ min-height:100vh; display:flex; flex-direction:column; }
#adminHeader{ display:flex; align-items:center; gap:10px; padding:10px 16px;
  background:var(--accent); color:#fff; }
#adminHeader h1{ font-size:16px; margin:0; font-weight:700; }
#adminHeader .sp{ flex:1; }
#adminHeader button{ background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.4);
  border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; }
#adminTabs{ display:flex; background:var(--card); border-bottom:1px solid var(--line); overflow-x:auto; }
#adminTabs button{ flex:1; border:none; background:none; padding:12px 8px; font-size:14px;
  color:var(--sub); border-bottom:3px solid transparent; cursor:pointer; white-space:nowrap; }
#adminTabs button.on{ color:var(--accent); border-bottom-color:var(--accent); font-weight:700; }
.adminBody{ padding:14px 16px 40px; flex:1; overflow:auto; }
.panel{ background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:14px 16px; margin-bottom:14px; box-shadow:var(--shadow); }
.panel h2{ font-size:15px; margin:0 0 10px; }
.small{ font-size:12px; color:var(--sub); }
.btn{ background:var(--accent); color:#fff; border:none; border-radius:9px;
  padding:11px 18px; font-size:15px; cursor:pointer; }
.btn.sec{ background:#eef2f4; color:var(--ink); border:1px solid var(--line); }
.btn.danger{ background:var(--err); }
.btn:disabled{ opacity:.45; cursor:default; }
input,select,textarea{ font-family:inherit; font-size:15px; padding:9px 10px;
  border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
textarea{ width:100%; }
label.f{ display:block; font-size:12px; color:var(--sub); margin:10px 0 4px; }
table.grid{ border-collapse:collapse; font-size:12px; }
table.grid th,table.grid td{ border:1px solid var(--line); padding:4px 5px; text-align:center;
  min-width:30px; }
table.grid th.name{ position:sticky; left:0; background:var(--card); text-align:left;
  min-width:80px; z-index:2; font-size:13px; }
table.grid td.cell{ cursor:pointer; }
table.grid td.cell:active{ background:#eaf4f5; }
td.ok{ color:var(--ok); } td.ng{ background:#fdecea; color:var(--err); font-weight:700; }
td.hol{ background:#f3f4f6; color:#b6bec5; } td.leave{ background:#fff6e0; }
.scrollX{ overflow-x:auto; }
ul.issues{ margin:6px 0; padding-left:0; list-style:none; }
ul.issues li{ padding:8px 10px; border:1px solid var(--line); border-radius:8px; margin-bottom:6px;
  font-size:13px; display:flex; gap:8px; align-items:flex-start; cursor:pointer; }
.fixBtns{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
.fixBtns button{ font-size:12px; padding:7px 10px; border-radius:7px; border:1px solid var(--accent);
  background:#eaf4f5; color:var(--accent); cursor:pointer; }
.fixBtns button:active{ background:var(--accent); color:#fff; }
ul.issues li .tag{ flex:none; font-size:11px; border-radius:6px; padding:2px 7px; color:#fff; }
.tag.block{ background:var(--err); } .tag.warn{ background:var(--warn); } .tag.info{ background:#7f8c9a; }
pre.csv{ background:#0f2530; color:#cfe8e5; font-size:12px; padding:12px; border-radius:8px;
  overflow:auto; max-height:300px; }

/* ---------- モーダル ---------- */
.modalBack{ position:fixed; inset:0; background:rgba(10,25,35,.45); z-index:100;
  display:flex; align-items:center; justify-content:center; padding:16px; }
.modal{ background:var(--card); border-radius:14px; padding:18px; width:100%;
  max-width:560px; max-height:88vh; overflow-y:auto; box-shadow:0 12px 40px rgba(0,0,0,.3); }
.modal h3{ margin:0 0 12px; font-size:16px; }
.pinDisp{ text-align:center; font-size:30px; letter-spacing:10px; min-height:44px;
  font-variant-numeric:tabular-nums; }
.pinPad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:280px; margin:10px auto; }
.pinPad button{ font-size:24px; padding:16px 0; border-radius:12px; border:1px solid var(--line);
  background:#f7f9fa; cursor:pointer; }
.pinMsg{ text-align:center; font-size:13px; color:var(--err); min-height:18px; }
.punchRow{ display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line);
  font-size:14px; flex-wrap:wrap; }
.punchRow img{ width:56px; height:42px; object-fit:cover; border-radius:6px; background:#ddd; cursor:pointer; }
.punchRow .noimg{ width:56px; height:42px; border-radius:6px; background:#eef1f3; color:#9aa7b0;
  font-size:10px; display:flex; align-items:center; justify-content:center; }
.punchRow.voided{ opacity:.45; text-decoration:line-through; }
.punchRow .mini{ font-size:11px; color:var(--sub); }
.punchRow select,.punchRow input{ font-size:13px; padding:5px 6px; }
.punchRow button{ font-size:12px; padding:6px 9px; border-radius:7px; border:1px solid var(--line);
  background:#f2f5f7; cursor:pointer; }
#photoModal img{ width:100%; border-radius:8px; }
.rowFlex{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }

/* selftest */
#selftestView{ padding:20px; font-size:14px; }
#selftestView .t-ok{ color:var(--ok); } #selftestView .t-ng{ color:var(--err); font-weight:700; }
@media (max-width:640px){ #staffGrid{ grid-template-columns:repeat(2,1fr); } }
</style>
<script>
/* VAULT-CLIENT:BEGIN v1 ─ 院内保管庫クライアント
   正本: Ai/院内保管庫/client/vault-client.js（アプリ側は直接直さず tools/inline_vault_client.py で差し替える）

   アプリのデータを「保存のたびに」院内の Mac mini（院内保管庫）へ複製する。
   - アプリの保存は今までどおり端末内。ここは失敗してもアプリの動作を一切止めない（例外を外へ出さない）
   - 合言葉・保管庫の住所・端末名は同じ配信元（github.io）の全アプリで共有（1台のiPadで1回入れればよい）
   - 患者データは localStorage に書かない（書くのは設定と送信状態だけ）

   使い方（各アプリ）:
     const vault = createVault({
       app: 'perio', label: '歯周検査', appVersion: APP_VERSION,
       getSnapshot: () => ({ data: {...}, counts: {patients: 3, exams: 10} }),   // 同期/非同期どちらでも
       listBlobIds: async () => [...],  getBlob: async id => 'data:image/jpeg;base64,...',   // 写真がある場合だけ
       restore: async (data, blobs) => ({ ok: true, message: '復元しました' }),   // blobs = {ids, get(id)}
     });
     保存が終わるたびに → vault.markDirty()
     同じIDの写真を差し替えたら → vault.forgetBlob(id)（次回その写真を送り直す）
     設定画面に → vault.mountSettings(element)
     見出しなどに → vault.mountBadge(element)
*/
(function (global) {
  'use strict';
  if (global.createVault) return;

  var DEFAULT_URL = 'https://mini.hatadental.net:8443';
  var CFG_KEY = 'vault.cfg';                       // {url, token, device}（全アプリ共通）
  var DEBOUNCE_MS = 3000;
  var SNAP_TIMEOUT_MS = 30000;
  var BLOB_TIMEOUT_MS = 60000;
  var HEARTBEAT_MS = 6 * 3600 * 1000;              // 変更がなくても6時間に1回は送る（重複はサーバーが捨てる）
  var BLOB_VERIFY_MS = 24 * 3600 * 1000;           // 1日1回、サーバー側の写真一覧と突き合わせる
  var TICK_MS = 30 * 60 * 1000;                    // 開いたままでも30分ごとに状態を確認

  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function now() { return Date.now(); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmtTime(t) {
    if (!t) return '';
    var d = new Date(t); if (isNaN(d)) return '';
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    var today = new Date(); var same = d.toDateString() === today.toDateString();
    return (same ? '今日 ' : (d.getMonth() + 1) + '/' + d.getDate() + ' ') + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function sumCounts(c) { var n = 0; if (c) for (var k in c) if (typeof c[k] === 'number') n += c[k]; return n; }
  function countsText(c, labels) {
    if (!c) return '';
    var out = [];
    for (var k in c) out.push((labels && labels[k] || k) + ' ' + c[k]);
    return out.join('・');
  }
  function randDevice() {
    var a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = '';
    for (var i = 0; i < 4; i++) s += a[Math.floor(Math.random() * a.length)];
    return 'iPad-' + s;
  }
  var DEVICE_RE = /^[\w぀-ヿ㐀-鿿ｦ-ﾟ\-]{1,32}$/;

  function getCfg() {
    var c = lsGet(CFG_KEY, null);
    if (!c || typeof c !== 'object') return null;
    return c;
  }
  function isConfigured(c) { return !!(c && c.url && c.token && c.device); }
  function urlProblem(u) {
    if (!/^https?:\/\/[^\s/]+/.test(u || '')) return '住所の形式が違います（https:// から始めてください）';
    var local = /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?(\/|$)/.test(u);
    if (/^http:/.test(u) && !local) return '鍵付き（https://）の住所が必要です';
    if (/^http:/.test(u) && location.protocol === 'https:' && !local) return 'この画面は https なので http の住所には送れません';
    return '';
  }

  // 返事の本文を読み終わるまでを時間切れの対象にする（本文の途中で止まっても先へ進めるように）
  function withTimeout(ms) {
    var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var rejectFn = null;
    var timeout = new Promise(function (_, rej) { rejectFn = rej; });
    var timer = setTimeout(function () {
      try { if (ctl) ctl.abort(); } catch (e) {}
      var e = new Error('Mac mini からの返事が途中で止まりました（時間切れ）'); e.kind = 'net'; rejectFn(e);
    }, ms);
    return {
      signal: ctl ? ctl.signal : undefined,
      race: function (p) {
        return Promise.race([p, timeout]).then(function (v) { clearTimeout(timer); return v; },
          function (e) { clearTimeout(timer); throw e; });
      }
    };
  }

  function api(cfg, method, path, body, ms, rawText) {
    var t = withTimeout(ms || SNAP_TIMEOUT_MS);
    var headers = { 'Authorization': 'Bearer ' + cfg.token };
    var payload;
    if (body !== undefined) {
      if (typeof body === 'string') { payload = body; headers['Content-Type'] = 'text/plain;charset=utf-8'; }
      else { payload = JSON.stringify(body); headers['Content-Type'] = 'application/json'; }
    }
    return t.race(fetch(cfg.url.replace(/\/+$/, '') + path, {
      method: method, headers: headers, body: payload, signal: t.signal, cache: 'no-store', mode: 'cors', credentials: 'omit'
    }).then(function (r) {
      if (r.status === 401) { var e1 = new Error('合言葉が違います'); e1.kind = 'auth'; throw e1; }
      if (r.status === 429) { var e2 = new Error('合言葉の間違いが続いたため一時停止中です（10分後に再試行）'); e2.kind = 'auth'; throw e2; }
      if (!r.ok) {
        return r.text().then(function (tx) {
          var msg = 'Mac mini がエラーを返しました（' + r.status + '）';
          try { var j = JSON.parse(tx); if (j && j.error) msg = j.error; } catch (e) {}
          var e3 = new Error(msg); e3.kind = 'server'; throw e3;
        });
      }
      return rawText ? r.text() : r.json();
    }, function (err) {
      var e4 = new Error('Mac mini に接続できません（院内Wi-Fi・Mac miniの電源を確認）'); e4.kind = 'net'; e4.cause = err; throw e4;
    }));
  }

  var STYLE_ID = 'vlt-style';
  var CSS = '' +
    '.vlt{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#1e2a35;background:#fff;border:1px solid #d9e2ec;border-radius:14px;padding:16px;margin:14px 0;line-height:1.55;text-align:left}' +
    '.vlt h3{font-size:1.02rem;margin:0 0 6px;display:flex;align-items:center;gap:6px}' +
    '.vlt p{margin:6px 0;font-size:.86rem}' +
    '.vlt .vlt-sub{color:#5b6b7b;font-size:.8rem}' +
    '.vlt label{display:block;font-size:.8rem;color:#5b6b7b;margin:10px 0 3px}' +
    '.vlt input{width:100%;box-sizing:border-box;font-size:16px;padding:10px 12px;border:1px solid #c5d0db;border-radius:10px;background:#fff;color:#1e2a35}' +
    '.vlt .vlt-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}' +
    '.vlt button{font-size:.9rem;padding:10px 14px;border-radius:10px;border:1px solid #c5d0db;background:#f4f7fa;color:#1e2a35;cursor:pointer;min-height:44px}' +
    '.vlt button.vlt-pri{background:#1d6fb8;border-color:#1d6fb8;color:#fff;font-weight:600}' +
    '.vlt button.vlt-warn{background:#fff7ed;border-color:#f0b37e;color:#9a4a07}' +
    '.vlt button:disabled{opacity:.5}' +
    '.vlt .vlt-st{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;padding:6px 10px;border-radius:999px;background:#f1f5f9}' +
    '.vlt .vlt-dot{width:9px;height:9px;border-radius:50%;display:inline-block}' +
    '.vlt .vlt-msg{margin-top:10px;font-size:.84rem;padding:8px 10px;border-radius:10px;display:none}' +
    '.vlt .vlt-msg.ok{display:block;background:#ecfdf3;color:#166534}' +
    '.vlt .vlt-msg.ng{display:block;background:#fef2f2;color:#991b1b}' +
    '.vlt .vlt-msg.info{display:block;background:#eff6ff;color:#1e40af}' +
    '.vlt .vlt-dev{border:1px solid #e2e8f0;border-radius:12px;padding:10px 12px;margin-top:8px}' +
    '.vlt .vlt-dev b{font-size:.92rem}' +
    '.vlt select{width:100%;font-size:15px;padding:8px;border-radius:10px;border:1px solid #c5d0db;margin-top:6px;background:#fff;color:#1e2a35}' +
    '.vlt details{margin-top:12px}.vlt summary{cursor:pointer;font-size:.86rem;color:#1d6fb8}' +
    '.vlt-badge{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;line-height:1;padding:3px 7px;border-radius:999px;background:rgba(255,255,255,.85);color:#334155;border:1px solid rgba(0,0,0,.08);white-space:nowrap;vertical-align:middle}' +
    '.vlt-badge i{width:7px;height:7px;border-radius:50%;display:inline-block}';
  function injectStyle() {
    if (document.getElementById(STYLE_ID)) return;
    var s = document.createElement('style'); s.id = STYLE_ID; s.textContent = CSS;
    (document.head || document.documentElement).appendChild(s);
  }

  var STATE_VIEW = {
    off: ['#94a3b8', 'Mac mini への保管は未設定'],
    ok: ['#16a34a', 'Mac mini に保管済み'],
    pending: ['#d97706', 'Mac mini へ送る準備中'],
    sending: ['#2563eb', 'Mac mini へ送信中…'],
    error: ['#dc2626', 'Mac mini に届いていません'],
    auth: ['#dc2626', '合言葉が違います'],
    guard: ['#dc2626', 'データが空のため送信を止めています']
  };

  function createVault(opt) {
    var app = opt.app;
    var SKEY = 'vault.' + app + '.state';
    var st = lsGet(SKEY, null) || {};
    if (!Array.isArray(st.sentBlobs)) st.sentBlobs = [];
    if (typeof st.gen !== 'number') st.gen = 0;
    var sentSet = {}; st.sentBlobs.forEach(function (id) { sentSet[id] = 1; });
    if (st.lastOkAt && !st.okDev) { var c0 = getCfg(); if (c0 && c0.device) st.okDev = c0.device; }   // 以前の版から更新した端末
    var blobGen = {};                 // 写真ごとの差し替え回数（送信中に差し替わったら送り直す）
    var listeners = [];
    var timer = null, inflight = null, again = false, retryMs = 0;
    var restoring = false;            // 復元中は自動送信しない
    var authFailedToken = null;       // この合言葉で断られた → 合言葉が変わるまで自動では送らない
    var live = { state: 'off', lastError: '' };

    function copy(o) { try { return JSON.parse(JSON.stringify(o || {})); } catch (e) { return {}; } }
    function saveState() { st.sentBlobs = Object.keys(sentSet); lsSet(SKEY, st); }
    function setLive(s, err) {
      live.state = s; live.lastError = err || '';
      // 画面から外れた部品の見張りは捨てる（描き直すたびに増え続けないように）
      listeners = listeners.filter(function (l) { return !l.el || l.el.isConnected !== false; });
      listeners.forEach(function (l) { try { l.fn(status()); } catch (e) {} });
    }
    function status() {
      var c = getCfg();
      var s = isConfigured(c) ? live.state : 'off';
      if (isConfigured(c) && s === 'off') s = st.pending ? 'pending' : (st.lastOkAt ? 'ok' : 'pending');
      return { state: s, lastOkAt: st.lastOkAt || null, lastError: live.lastError, pending: !!st.pending,
        device: c && c.device, url: c && c.url, lastCounts: st.lastCounts || null, blobsSent: Object.keys(sentSet).length };
    }
    function onStatus(fn, el) {
      var l = { fn: fn, el: el || null };
      listeners.push(l);
      return function () { listeners = listeners.filter(function (x) { return x !== l; }); };
    }
    function authBlocked() { var c = getCfg(); return !!(authFailedToken && c && c.token === authFailedToken); }

    function schedule(ms) {
      if (timer) clearTimeout(timer);
      timer = setTimeout(function () { timer = null; pushNow('auto'); }, ms);
    }
    function markDirty() {
      try {
        st.gen += 1; st.pending = true; if (!st.pendingSince) st.pendingSince = now(); saveState();
        if (!isConfigured(getCfg()) || authBlocked() || restoring) return;
        retryMs = 0;
        setLive('pending');
        schedule(DEBOUNCE_MS);
      } catch (e) {}
    }

    function snapshot() {
      return Promise.resolve().then(function () { return opt.getSnapshot(); }).then(function (s) {
        if (!s || s.data == null) throw new Error('データを読み取れませんでした');
        return { data: s.data, counts: s.counts ? copy(s.counts) : null };   // 件数は写しを使う（アプリ側で書き換えられても影響しない）
      });
    }
    function putSnap(cfg, s, reason) {
      return api(cfg, 'PUT', '/v1/' + app + '/snap/' + encodeURIComponent(cfg.device), {
        data: s.data, counts: s.counts || {}, appVersion: String(opt.appVersion || ''),
        reason: reason, clientAt: new Date().toISOString()
      }, SNAP_TIMEOUT_MS);
    }

    // この端末（この名前）から初めて送るとき：同じ名前の保管データが Mac mini にあれば自動では上書きしない
    // （iPad を入れ替えて同じ名前を付けた直後に、見本データや空のデータが「最新」になるのを防ぐ）
    function firstPushCheck(cfg, reason) {
      if (reason !== 'auto' || st.intended || st.okDev === cfg.device) return Promise.resolve();
      return api(cfg, 'GET', '/v1/' + app + '/snaps', undefined, SNAP_TIMEOUT_MS).then(function (j) {
        var nf = function (x) { try { return String(x).normalize('NFC'); } catch (e) { return String(x); } };
        var mine = (j.devices || []).filter(function (d) { return nf(d.device) === nf(cfg.device); })[0];
        if (mine && mine.latest && sumCounts(mine.latest.counts) > 0) {
          var g = new Error('「' + cfg.device + '」の名前で Mac mini に保管されたデータがあります（' + countsText(mine.latest.counts) +
            (mine.latest.at ? '・' + fmtTime(mine.latest.at) : '') + '）。この端末から初めて送るので、上書きせずに止めています。前のデータを戻すなら「Mac mini から復元する」、この端末の内容で良ければ「今すぐ送る」を押してください。');
          g.kind = 'guard'; throw g;
        }
      });
    }

    function pushNow(reason) {
      var cfg = getCfg();
      if (!isConfigured(cfg)) return Promise.resolve({ ok: false, skipped: 'unconfigured' });
      if (restoring) return Promise.resolve({ ok: false, skipped: 'restoring' });
      if (reason === 'auto' && authBlocked()) return Promise.resolve({ ok: false, kind: 'auth', error: live.lastError });
      if (inflight) { again = true; return inflight; }
      if (reason === 'manual' && !st.intended) { st.intended = true; saveState(); }   // 意図した送信：失敗→再試行でも安全装置を通さない
      setLive('sending');
      var gen = st.gen;
      inflight = snapshot().then(function (s) {
        return firstPushCheck(cfg, reason).then(function () { return s; });
      }).then(function (s) {
        var total = sumCounts(s.counts);
        var prev = sumCounts(st.lastCounts);
        // 端末のデータが空になった・急に半分以下に減った（消えた・壊れた・見本データで起動した）ときは、
        // 黙って送らない。意図した削除なら設定画面の「今すぐ送る」で送れる。
        if (reason === 'auto' && s.counts && !st.intended) {
          var g = null;
          if (total === 0 && prev > 0) {
            g = new Error('この端末のデータが空になっています。Mac mini の保管分は上書きせず残しています。必要なら「Mac mini から復元」してください。');
          } else if (prev >= 10 && total < prev * 0.5) {
            g = new Error('件数が急に減ったため送信を止めています（前回 ' + prev + ' → 今回 ' + total + '）。意図した削除なら設定画面の「今すぐ送る」を押してください。');
          }
          if (g) { g.kind = 'guard'; throw g; }
        }
        return putSnap(cfg, s, reason === 'manual' ? 'manual' : 'auto').then(function (res) {
          authFailedToken = null;
          st.lastOkAt = now(); st.lastCounts = s.counts || {}; st.lastFile = res && res.file;
          st.okDev = cfg.device; st.intended = false;
          if (st.gen === gen) { st.pending = false; st.pendingSince = null; }   // 送信中に編集があれば未送信のまま
          saveState();
          return syncBlobs(cfg).then(function (b) { return { ok: true, dup: !!(res && res.dup), blobs: b }; });
        });
      }).then(function (r) {
        retryMs = 0;
        setLive(st.pending || st.blobsPending ? 'pending' : 'ok');
        // 送信中に編集・写真の差し替えがあった → 間を置かずに続きを送る
        if (st.pending || st.blobsPending) schedule(DEBOUNCE_MS);
        return r;
      }, function (err) {
        var kind = (err && err.kind) || 'app';
        if (kind === 'auth') authFailedToken = cfg.token;
        setLive(kind === 'auth' ? 'auth' : kind === 'guard' ? 'guard' : 'error', err && err.message);
        if (kind === 'net' || kind === 'server' || kind === 'app') {   // 合言葉違い・ガードは自動では打ち直さない
          retryMs = Math.min(retryMs ? retryMs * 2 : 30000, 10 * 60000);
          schedule(retryMs);
        }
        return { ok: false, error: err && err.message, kind: kind };
      }).then(function (r) {
        inflight = null;
        if (again) {
          again = false;
          if (r.ok) schedule(1000);                  // 失敗時は上の再試行の予定を上書きしない
        }
        return r;
      });
      return inflight;
    }

    function syncBlobs(cfg) {
      if (typeof opt.listBlobIds !== 'function' || typeof opt.getBlob !== 'function') return Promise.resolve({ sent: 0 });
      // 端末名が変わったら（別のアプリの設定画面で変えた場合も）、新しい名前のフォルダへ送り直す
      if (st.blobDev !== cfg.device) { sentSet = {}; st.blobDev = cfg.device; st.blobsVerifiedAt = 0; }
      st.blobsPending = true; saveState();        // 最後まで送り切るまでは「写真未完了」
      var dev = encodeURIComponent(cfg.device);
      var verify = (!st.blobsVerifiedAt || now() - st.blobsVerifiedAt > BLOB_VERIFY_MS)
        ? api(cfg, 'GET', '/v1/' + app + '/blobs/' + dev, undefined, SNAP_TIMEOUT_MS).then(function (j) {
          var srv = {}; (j.ids || []).forEach(function (id) { srv[id] = 1; });
          Object.keys(sentSet).forEach(function (id) { if (!srv[id]) delete sentSet[id]; });   // サーバーに無いものは送り直す
          st.blobsVerifiedAt = now(); saveState();
        })
        : Promise.resolve();
      var changed = false;
      return verify.then(function () { return Promise.resolve(opt.listBlobIds()); }).then(function (ids) {
        var todo = (ids || []).filter(function (id) { return !sentSet[id] && /^[A-Za-z0-9_\-][A-Za-z0-9_\-.]{0,127}$/.test(id); });
        var sent = 0, i = 0;
        function next() {
          if (i >= todo.length) return { sent: sent };
          var id = todo[i++];
          var g = blobGen[id] || 0;
          return Promise.resolve(opt.getBlob(id)).then(function (val) {
            if (val == null) return next();          // 削除済みの写真など
            var body = typeof val === 'string' ? val : JSON.stringify(val);
            return api(cfg, 'PUT', '/v1/' + app + '/blob/' + dev + '/' + encodeURIComponent(id), body, BLOB_TIMEOUT_MS).then(function () {
              if ((blobGen[id] || 0) === g) sentSet[id] = 1; else changed = true;   // 送信中に差し替わった → 次回送り直す
              sent++;
              if (sent % 5 === 0) saveState();
              return next();
            });
          });
        }
        return next();
      }).then(function (r) { st.blobsPending = changed; saveState(); return r; });
    }

    // ── 復元 ──
    function listSnaps() {
      var cfg = getCfg();
      if (!isConfigured(cfg)) return Promise.reject(new Error('先に保管庫の設定をしてください'));
      return api(cfg, 'GET', '/v1/' + app + '/snaps').then(function (j) { return j.devices || []; });
    }
    function waitIdle() { return inflight ? inflight.then(waitIdle, waitIdle) : Promise.resolve(); }
    function restoreFrom(device, file, onProgress) {
      var cfg = getCfg();
      if (!isConfigured(cfg)) return Promise.reject(new Error('先に保管庫の設定をしてください'));
      if (restoring) return Promise.reject(new Error('復元の処理中です'));
      var dev = encodeURIComponent(device);
      var prog = onProgress || function () {};
      var target = file;
      restoring = true;
      if (timer) { clearTimeout(timer); timer = null; }
      return Promise.resolve().then(function () {
        // 「最新」は控えを送る前に具体的なファイル名にしておく（控え自身を戻さないように）
        if (target && target !== 'latest') return;
        return listSnaps().then(function (devs) {
          var d = devs.filter(function (x) { return x.device === device; })[0];
          if (!d || !d.latest) throw new Error('「' + device + '」の保管データが見つかりません');
          target = d.latest.file;
        });
      }).then(waitIdle).then(function () {
        prog('復元前の状態を Mac mini に控えています…');
        // 控えは通常の送信と混ぜず、必ず専用に1回送る。送れなければ復元しない
        return snapshot().then(function (s) {
          return putSnap(cfg, s, 'pre-restore').catch(function (e) {
            throw new Error('復元前の控えを Mac mini に保存できなかったため中止しました：' + e.message);
          }).then(function () {
            // まだ送っていない写真も先に控える（復元後の片付けで消えても Mac mini に残るように）
            return syncBlobs(cfg).catch(function (e) {
              throw new Error('復元前に、まだ送っていない写真を Mac mini に控えられなかったため中止しました：' + e.message);
            });
          });
        }, function () {
          prog('この端末のデータを読み取れないため、控えは取らずに復元します…');   // 守るべき中身が読めない＝復元が必要な状態
        });
      }).then(function () {
        prog('Mac mini からデータを受け取っています…');
        return api(cfg, 'GET', '/v1/' + app + '/snap/' + dev + '/' + encodeURIComponent(target), undefined, 120000);
      }).then(function (env) {
        if (!env || env.app !== app || env.data == null) throw new Error('受け取ったデータの形式が違います');
        var blobIds = null;
        var blobs = {
          ids: function () {
            if (blobIds) return Promise.resolve(blobIds);
            return api(cfg, 'GET', '/v1/' + app + '/blobs/' + dev).then(function (j) { blobIds = j.ids || []; return blobIds; });
          },
          get: function (id) { return api(cfg, 'GET', '/v1/' + app + '/blob/' + dev + '/' + encodeURIComponent(id), undefined, BLOB_TIMEOUT_MS, true); }
        };
        prog('この端末に書き戻しています…');
        return Promise.resolve(opt.restore(env.data, blobs, env)).then(function (res) {
          res = res || { ok: true };
          if (res.ok) {
            // 復元した内容がこの端末の新しい基準。写真は中身が変わり得るので全部送り直す（同じ中身は Mac mini が捨てる）
            st.lastCounts = copy(env.counts || st.lastCounts); sentSet = {}; st.blobsVerifiedAt = 0; saveState();
          }
          return res;
        });
      }).then(function (res) {
        restoring = false;
        if (res && res.ok) markDirty(); else if (st.pending) schedule(DEBOUNCE_MS);
        return res;
      }, function (e) {
        restoring = false;
        if (st.pending) schedule(DEBOUNCE_MS);
        throw e;
      });
    }

    // ── 画面部品 ──
    function mountBadge(el) {
      if (!el) return;
      injectStyle();
      function draw(s) {
        if (s.state === 'off') { el.innerHTML = ''; return; }
        var v = STATE_VIEW[s.state] || STATE_VIEW.pending;
        var txt = s.state === 'ok' ? '保管 ' + fmtTime(s.lastOkAt) : v[1];
        el.innerHTML = '<span class="vlt-badge" title="' + esc(v[1] + (s.lastError ? '：' + s.lastError : '')) + '"><i style="background:' + v[0] + '"></i>🖥 ' + esc(txt) + '</span>';
      }
      draw(status());
      onStatus(draw, el);
    }

    function mountSettings(el, labels) {
      if (!el) return;
      injectStyle();
      var c = getCfg() || {};
      var box = document.createElement('div');
      box.className = 'vlt';
      box.innerHTML =
        '<h3>🖥 Mac mini への自動バックアップ</h3>' +
        '<p class="vlt-sub">保存するたびに、この端末のデータの複製を院内の Mac mini へ送ります。アプリの使い方は変わりません。合言葉は同じ iPad の他の院内アプリと共通です。</p>' +
        '<div><span class="vlt-st" data-v="st"></span></div>' +
        '<label>この iPad の名前（例：受付iPad・チェア1）</label><input data-v="device" maxlength="32" autocomplete="off" autocapitalize="off">' +
        '<label>合言葉</label><input data-v="token" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">' +
        '<details><summary>Mac mini の住所（通常は変更不要）</summary><label>住所</label><input data-v="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false"></details>' +
        '<div class="vlt-row"><button class="vlt-pri" data-a="save">保存して接続を確認</button><button data-a="push">今すぐ送る</button></div>' +
        '<div class="vlt-msg" data-v="msg"></div>' +
        '<details data-v="rsbox"><summary>Mac mini から復元する（iPad の入れ替え・データが消えたとき）</summary>' +
        '<p class="vlt-sub">Mac mini に保管されている複製で、この端末のデータを<b>置き換え</b>ます。置き換える前の状態も自動で Mac mini に控えます。</p>' +
        '<div class="vlt-row"><button data-a="list">保管されている一覧を見る</button></div><div data-v="devs"></div></details>';
      el.innerHTML = '';
      el.appendChild(box);
      var $ = function (k) { return box.querySelector('[data-v="' + k + '"]'); };
      $('device').value = c.device || randDevice();
      $('token').value = c.token || '';
      $('url').value = c.url || DEFAULT_URL;
      function msg(kind, text) { var m = $('msg'); m.className = 'vlt-msg ' + kind; m.textContent = text; }
      function drawSt(s) {
        var v = STATE_VIEW[s.state] || STATE_VIEW.pending;
        var extra = s.state === 'ok' && s.lastOkAt ? '（' + fmtTime(s.lastOkAt) + '）' : (s.lastError && s.state !== 'ok' ? '：' + s.lastError : '');
        $('st').innerHTML = '<i class="vlt-dot" style="background:' + v[0] + '"></i>' + esc(v[1] + extra);
      }
      drawSt(status());
      onStatus(drawSt, box);

      box.querySelector('[data-a="save"]').onclick = function () {
        var dev = $('device').value.trim(), tok = $('token').value, url = $('url').value.trim().replace(/\/+$/, '');
        if (!DEVICE_RE.test(dev)) return msg('ng', 'iPad の名前は32文字以内で、記号は「-」「_」だけ使えます');
        if (tok.length < 8) return msg('ng', '合言葉を入れてください（8文字以上）');
        var up = urlProblem(url); if (up) return msg('ng', up);
        var old = getCfg() || {};
        var next = { url: url, token: tok, device: dev, v: 1 };
        msg('info', '確認しています…');
        api(next, 'GET', '/v1/auth', undefined, 15000).then(function () {
          lsSet(CFG_KEY, next);
          authFailedToken = null;
          if (old.device && old.device !== dev) { sentSet = {}; st.blobsVerifiedAt = 0; saveState(); }
          msg('ok', '✅ Mac mini につながりました。これから保存のたびに自動で送ります。');
          return checkExistingThenPush(dev);
        }).catch(function (e) { msg('ng', '❌ ' + e.message); });
      };
      box.querySelector('[data-a="push"]').onclick = function () {
        if (!isConfigured(getCfg())) return msg('ng', '先に合言葉を入れて「保存して接続を確認」を押してください');
        msg('info', '送っています…');
        pushNow('manual').then(function (r) {
          if (r.ok) msg('ok', r.dup ? '✅ Mac mini の保管分は最新です' : '✅ Mac mini に送りました' + (r.blobs && r.blobs.sent ? '（写真 ' + r.blobs.sent + ' 件）' : ''));
          else msg('ng', '❌ ' + r.error);
        });
      };
      // 同じ名前の iPad の保管分があって、この端末が空なら、上書きする前に復元を勧める
      function checkExistingThenPush(dev) {
        return Promise.resolve(opt.getSnapshot()).then(function (s) {
          var localTotal = sumCounts(s && s.counts);
          return listSnaps().then(function (devs) {
            var mine = devs.filter(function (d) { return d.device === dev; })[0];
            var srvTotal = mine && mine.latest ? sumCounts(mine.latest.counts) : 0;
            if (localTotal === 0 && srvTotal > 0) {
              msg('info', '「' + dev + '」の名前で Mac mini に保管されたデータがあります（' + countsText(mine.latest.counts, labels) + '・' + fmtTime(mine.latest.at) + '）。この端末は空なので、下の「Mac mini から復元する」で戻せます。');
              $('rsbox').open = true;
              return drawDevs();
            }
            markDirty();
          });
        }).catch(function () { markDirty(); });
      }
      function drawDevs() {
        var wrap = $('devs');
        wrap.innerHTML = '<p class="vlt-sub">読み込み中…</p>';
        return listSnaps().then(function (devs) {
          if (!devs.length) { wrap.innerHTML = '<p class="vlt-sub">まだ何も保管されていません。</p>'; return; }
          wrap.innerHTML = '';
          devs.forEach(function (d) {
            var row = document.createElement('div'); row.className = 'vlt-dev';
            var opts = (d.history || []).map(function (h) {
              return '<option value="' + esc(h.file) + '">' + esc(fmtTime(h.at) + '　' + countsText(h.counts, labels) + (h.reason === 'pre-restore' ? '　（復元前の控え）' : '')) + '</option>';
            }).join('');
            row.innerHTML = '<b>' + esc(d.device) + '</b>' + (d.device === (getCfg() || {}).device ? '　<span class="vlt-sub">（この iPad）</span>' : '') +
              '<div class="vlt-sub">最終 ' + esc(d.latest ? fmtTime(d.latest.at) : '—') + (d.blobs ? '・写真 ' + d.blobs + ' 件' : '') + '</div>' +
              '<select>' + opts + '</select><div class="vlt-row"><button class="vlt-warn">この内容で復元</button></div>';
            row.querySelector('button').onclick = function () {
              var file = row.querySelector('select').value;
              var h = (d.history || []).filter(function (x) { return x.file === file; })[0] || {};
              var q = '「' + d.device + '」の ' + fmtTime(h.at) + ' の内容（' + countsText(h.counts, labels) + '）で、この端末のデータを置き換えます。\n\n今この端末に入っている内容は、置き換える前に Mac mini に控えます。\n\nよろしいですか？';
              if (!confirm(q)) return;
              var btns = box.querySelectorAll('button'); Array.prototype.forEach.call(btns, function (b) { b.disabled = true; });
              restoreFrom(d.device, file, function (t) { msg('info', t); }).then(function (res) {
                if (res && res.ok) msg('ok', '✅ ' + (res.message || '復元しました'));
                else msg('ng', '❌ ' + ((res && res.message) || '復元できませんでした'));
              }).catch(function (e) { msg('ng', '❌ ' + e.message); }).then(function () {
                Array.prototype.forEach.call(btns, function (b) { b.disabled = false; });
              });
            };
            wrap.appendChild(row);
          });
        }).catch(function (e) { wrap.innerHTML = ''; msg('ng', '❌ ' + e.message); });
      }
      box.querySelector('[data-a="list"]').onclick = drawDevs;
    }

    // ── 起動時・画面の出入り・定期チェック ──
    function kick() {
      var cfg = getCfg();
      if (!isConfigured(cfg)) { setLive('off'); return; }
      if (restoring || inflight) return;
      if (authBlocked()) { setLive('auth', live.lastError || '合言葉が違います'); return; }
      if (st.pending || st.blobsPending) { setLive('pending'); schedule(2000); }
      else if (!st.lastOkAt || now() - st.lastOkAt > HEARTBEAT_MS) { schedule(5000); setLive(st.lastOkAt ? 'ok' : 'pending'); }
      else if (live.state !== 'guard' && live.state !== 'error') setLive('ok');
    }
    // 開いたままの端末（打刻iPadなど）でも30分ごとに確認する
    function tick() { try { kick(); } catch (e) {} setTimeout(tick, TICK_MS); }
    try {
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden' && st.pending && isConfigured(getCfg()) && !authBlocked()) pushNow('auto');
        if (document.visibilityState === 'visible') kick();
      });
      global.addEventListener('online', function () { if (st.pending) schedule(1000); });
      setTimeout(kick, 0);
      setTimeout(tick, TICK_MS);
    } catch (e) {}

    // 同じIDのまま中身が差し替わった写真（在庫の商品写真など）は、これを呼ぶと次回送り直す
    function forgetBlob(id) {
      try { blobGen[id] = (blobGen[id] || 0) + 1; if (sentSet[id]) { delete sentSet[id]; saveState(); } markDirty(); } catch (e) {}
    }

    return {
      markDirty: markDirty, forgetBlob: forgetBlob, pushNow: function () { return pushNow('manual'); }, status: status, onStatus: onStatus,
      listSnaps: listSnaps, restoreFrom: restoreFrom, mountSettings: mountSettings, mountBadge: mountBadge,
      _listenerCount: function () { return listeners.length; },
      isConfigured: function () { return isConfigured(getCfg()); },
      _debug: { st: st, sentSet: function () { return sentSet; } }
    };
  }

  global.createVault = createVault;
})(typeof window !== 'undefined' ? window : this);
/* VAULT-CLIENT:END */
</script>

<script>
'use strict';
/* =========================================================================
   勤怠打刻アプリ（はた歯科医院） — 単一HTML・iPad Safari向け
   出力: 給与計算アプリ.html の勤怠CSVスキーマに完全準拠
   date,employee_id,clock_in,clock_out,break_minutes,leave_type,outing_minutes
   ========================================================================= */
const APP_VERSION = '1.2.0';
const DATA_SCHEMA = 1;
const NS = 'dakoku_';                       // 同一オリジン他アプリとのlocalStorage衝突回避
const UNDO_SECONDS = 10;                    // 打刻直後の取消可能時間
const DUP_GUARD_MIN = 3;                    // 同一人×同一種別の二重打刻ガード(分)
const DRIFT_LIMIT_SEC = 120;                // 時計ズレ警告閾値

const PUNCH_TYPES = {
  in:'出勤', bs:'休憩入', be:'休憩戻', os:'外出', oe:'戻り', out:'退勤'
};
const LEAVE_TYPES = {
  none:'（なし）', full_paid:'有給(終日)', half_paid_am:'半日有給(午前休)',
  half_paid_pm:'半日有給(午後休)', special_paid:'特別休暇(有給)',
  special_unpaid:'特別休暇(無給)', unpaid_leave:'無給休暇', absence:'欠勤'
};
const LEAVE_ABBR = {
  full_paid:'有', half_paid_am:'前', half_paid_pm:'後', special_paid:'特',
  special_unpaid:'特無', unpaid_leave:'無', absence:'欠'
};

/* =========================================================================
   医院カレンダー（給与計算アプリ.html L171-224 から移植・同一ロジック）
   ========================================================================= */
const DEFAULT_HOLIDAYS = [
 "2026-01-01","2026-01-12","2026-02-11","2026-02-23","2026-03-20","2026-04-29",
 "2026-05-03","2026-05-04","2026-05-05","2026-05-06","2026-07-20","2026-08-11",
 "2026-09-21","2026-09-22","2026-09-23","2026-10-12","2026-11-03","2026-11-23",
 "2027-01-01","2027-01-11","2027-02-11","2027-02-23","2027-03-21","2027-03-22",
 "2027-04-29","2027-05-03","2027-05-04","2027-05-05","2027-07-19","2027-08-11",
 "2027-09-20","2027-09-23","2027-10-11","2027-11-03","2027-11-23"
];
const SCHED = { // 曜日(0=日) → [始業分, 終業分, 休憩開始分, 休憩終了分] / nullは休
  1:[510,1020,750,810], 5:[510,1020,750,810],       // 月金 7h30m
  2:[510,1080,720,810], 3:[510,1080,720,810],       // 火水 8h00m
  6:[510,780,null,null]                              // 土 4h30m
};
const THU_SHORT=[510,720,null,null], THU_LONG=[510,1080,720,810];
function ymd(dstr){ const [y,m,d]=dstr.split('-').map(Number); return {y,m,d}; }
function dow(dstr){ const {y,m,d}=ymd(dstr); return new Date(Date.UTC(y,m-1,d)).getUTCDay(); }
function addDays(dstr,n){ const {y,m,d}=ymd(dstr); const t=new Date(Date.UTC(y,m-1,d+n));
  return t.toISOString().slice(0,10); }
function isSeasonal(dstr){ const {m,d}=ymd(dstr);
  return (m===8&&d>=13&&d<=15)||(m===12&&d>=30)||(m===1&&d<=3); }
function Calendar(settings){
  const holi = new Set(settings.holidays||DEFAULT_HOLIDAYS);
  const thuOv = settings.thursdayOverrides||{};   // {date:'normal'|'long'}
  const extraShotei = new Set(settings.extraShoteiHolidays||[]);
  function isNational(d){ return holi.has(d); }
  function isLegalHoliday(d){ return dow(d)===0; }          // 日曜
  function isShotei(d){ return isNational(d)||isSeasonal(d)||extraShotei.has(d); }
  function weekHasHoliday(d){
    let sun = addDays(d, -((dow(d)+7)%7));
    for(let i=0;i<7;i++) if(isNational(addDays(sun,i))) return true;
    return false;
  }
  function schedule(d){ // [start,end,bs,be] or null
    if(isLegalHoliday(d)||isShotei(d)) return null;
    const w = dow(d);
    if(w===4){ const ov=thuOv[d];
      if(ov==='normal') return THU_SHORT; if(ov==='long') return THU_LONG;
      return weekHasHoliday(d)?THU_LONG:THU_SHORT; }
    return SCHED[w]||null;
  }
  function workMin(sch){ if(!sch) return 0;
    let br = (sch[2]==null)?0:(sch[3]-sch[2]); return sch[1]-sch[0]-br; }
  function halfPaidAllowed(d){
    const sch=schedule(d); return sch!=null && sch[2]!=null; }
  return {isNational,isLegalHoliday,isShotei,schedule,workMin,halfPaidAllowed,weekHasHoliday};
}

/* =========================================================================
   ストレージ層（localStorage: dakoku_*）
   ========================================================================= */
function lsGet(key, fallback){
  try{ const v=localStorage.getItem(NS+key); return v?JSON.parse(v):fallback; }
  catch(e){ return fallback; }
}
let vault = null;          // 院内保管庫（Mac mini）。実データ起動時だけ initVault() で作る。セルフテスト中は null のまま
let vaultRestoring = false; // Mac mini からの復元中は送信予約しない（復元後にまとめて1回送る）
function vaultDirty(){ if(vaultRestoring) return; try{ if(vault) vault.markDirty(); }catch(_){} }
function lsSet(key, val){
  localStorage.setItem(NS+key, JSON.stringify(val));   // 失敗時は従来どおり例外を呼び出し元へ
  // 院内保管庫（Mac mini）へ複製を送る予約。PIN失敗カウンタ・テスト用キーは送らない。失敗しても保存には影響しない
  if(key!=='pinlock_v1' && key.indexOf('__')!==0) vaultDirty();
}

const DEFAULT_SETTINGS = {
  schema:DATA_SCHEMA, pin_hash:null, pin_salt:null,
  photo_retention_days:90,
  holidays:DEFAULT_HOLIDAYS.slice(), thursdayOverrides:{}, extraShoteiHolidays:[]
};
let settings = Object.assign({}, DEFAULT_SETTINGS, lsGet('settings_v1', {}));
function saveSettings(){ lsSet('settings_v1', settings); cal = Calendar(settings); }
let cal = Calendar(settings);

let staff = lsGet('staff_v1', []);   // [{id,name,active,order}]
function saveStaff(){ lsSet('staff_v1', staff); }
function activeStaff(){ return staff.filter(s=>s.active).sort((a,b)=>(a.order-b.order)||(a.id-b.id)); }
// 管理画面・締め用: 在籍中に加え、退職済みでもその月にデータがある人を含める
// （退職月に「在籍」を外しても最終月の給与CSVから漏れないように）
function staffForMonth(doc, staffList){
  const hasData = s => doc.punches.some(p=>p.sid===s.id && !p.void) ||
    Object.keys(doc.days).some(k=>k.startsWith(s.id+'|'));
  return staffList.filter(s=>s.active || hasData(s)).sort((a,b)=>(a.order-b.order)||(a.id-b.id));
}

function monthKeyOf(dstr){ return dstr.slice(0,7); }
function emptyMonthDoc(){ return {schema:DATA_SCHEMA, punches:[], days:{}, corrections:[], closed:null}; }
const monthCache = {};
function loadMonth(ym){
  if(!monthCache[ym]) monthCache[ym] = lsGet('m_'+ym+'_v1', null) || emptyMonthDoc();
  return monthCache[ym];
}
function saveMonth(ym){ lsSet('m_'+ym+'_v1', monthCache[ym]); }
function listMonthKeys(){
  const out=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
    const m=k && k.match(new RegExp('^'+NS+'m_(\\d{4}-\\d{2})_v1$')); if(m) out.push(m[1]); }
  return out.sort();
}

/* ---------- 時刻ユーティリティ ---------- */
function pad2(n){ return String(n).padStart(2,'0'); }
function todayStr(now){ const t=now||new Date();
  return `${t.getFullYear()}-${pad2(t.getMonth()+1)}-${pad2(t.getDate())}`; }
function nowHM(now){ const t=now||new Date(); return `${pad2(t.getHours())}:${pad2(t.getMinutes())}`; }
function hmToMin(hm){ if(!hm) return null; const [h,m]=hm.split(':').map(Number); return h*60+m; }
function minToHM(min){ return `${pad2(Math.floor(min/60))}:${pad2(min%60)}`; }
function lastDayOf(ym){ const [y,m]=ym.split('-').map(Number); return new Date(Date.UTC(y,m,0)).getUTCDate(); }
function genId(){ return 'p_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* =========================================================================
   打刻コアロジック（純関数群 — selftestから直接テストする）
   ========================================================================= */
function validPunches(doc, sid, dstr){
  return doc.punches.filter(p=>p.sid===sid && p.d===dstr && !p.void)
    .sort((a,b)=>hmToMin(a.t)-hmToMin(b.t) || a.at-b.at);
}
// 次に押すべき打刻種別の推定
function nextType(doc, sid, dstr, calendar){
  const ps = validPunches(doc, sid, dstr);
  const has = ty => ps.some(p=>p.ty===ty);
  const sch = (calendar||cal).schedule(dstr);
  const seq = (sch && sch[2]!=null) ? ['in','bs','be','out'] : ['in','out'];
  for(const ty of seq){ if(!has(ty)) return ty; }
  return null; // 退勤済み
}
// 二重打刻ガード: 同一人×同一種別がN分以内なら既存打刻を返す
function findDup(doc, sid, dstr, ty, hm){
  const t = hmToMin(hm);
  return validPunches(doc, sid, dstr).find(p=>p.ty===ty && Math.abs(hmToMin(p.t)-t)<DUP_GUARD_MIN);
}
// ペア合計(分): 開始種別→終了種別を時刻順に結合
function pairSum(ps, startTy, endTy){
  const ev = ps.filter(p=>p.ty===startTy||p.ty===endTy);
  let total=0, open=null;
  for(const p of ev){
    if(p.ty===startTy){ if(open==null) open=hmToMin(p.t); }
    else { if(open!=null){ total+=Math.max(0,hmToMin(p.t)-open); open=null; } }
  }
  return total;
}
function dayLeave(doc, sid, dstr){
  const rec = doc.days[sid+'|'+dstr]; return (rec && rec.leave) || 'none';
}

/* ---------- 月次 → CSV行生成（給与計算アプリの取込スキーマ完全準拠） ---------- */
function buildMonthRows(staffList, doc, ym){
  const last = lastDayOf(ym);
  const rows = [];
  const sids = staffList.slice().sort((a,b)=>a.id-b.id);
  for(const s of sids){
    for(let d=1; d<=last; d++){
      const dstr = ym+'-'+pad2(d);
      if(monthKeyOf(dstr)!==ym) continue;            // 月外行はエンジン側バグを踏むため二重防御
      const ps = validPunches(doc, s.id, dstr);
      const leave = dayLeave(doc, s.id, dstr);
      if(!ps.length && leave==='none') continue;
      const ins = ps.filter(p=>p.ty==='in'), outs = ps.filter(p=>p.ty==='out');
      const cin = ins.length ? ins.map(p=>p.t).sort()[0] : '';
      const cout = outs.length ? outs.map(p=>p.t).sort().slice(-1)[0] : '';
      rows.push([dstr, s.id, cin, cout, pairSum(ps,'bs','be'), leave, pairSum(ps,'os','oe')]);
    }
  }
  return rows;
}
function rowsToCSV(rows){
  const head = 'date,employee_id,clock_in,clock_out,break_minutes,leave_type,outing_minutes';
  return head + '\n' + rows.map(r=>r.join(',')).join('\n') + '\n';
}

/* ---------- 月次検証（締めブロック/警告。管理画面の異常一覧と共用） ----------
   full=true: 月の全日を対象(締め時) / false: 今日より前のみ(日常の異常一覧) */
function validateMonth(staffList, doc, ym, calendar, opts){
  const C = calendar||cal;
  const full = opts && opts.full;
  const today = todayStr();
  const last = lastDayOf(ym);
  const blocks=[], warns=[], infos=[];
  const B=(sid,d,msg,fix)=>blocks.push({sid,d,msg,fix});
  const W=(sid,d,msg,fix)=>warns.push({sid,d,msg,fix});
  const I=(sid,d,msg)=>infos.push({sid,d,msg});
  for(const s of staffList){
    // 月内に打刻も休暇入力も一切ないスタッフは日別ブロックにせず警告1件（月途中入社・退職対応）
    const anyData = doc.punches.some(p=>p.sid===s.id && !p.void && monthKeyOf(p.d)===ym) ||
      Object.keys(doc.days).some(k=>k.startsWith(s.id+'|'));
    if(!anyData){
      W(s.id, ym+'-01', 'この月のデータが1件もありません（この月に在籍していなければそのままでOK。在籍していた場合は打刻/休暇を入力）');
      continue;
    }
    for(let dd=1; dd<=last; dd++){
      const dstr = ym+'-'+pad2(dd);
      if(!full && dstr>=today) continue;             // 未来日と当日は日常表示では対象外
      if(full && dstr>=today && dstr>today) continue; // 締めでも未来日は対象外(当月途中締め対策)
      const ps = validPunches(doc, s.id, dstr);
      const leave = dayLeave(doc, s.id, dstr);
      const sch = C.schedule(dstr);
      const fullDayLeave = ['full_paid','special_paid','special_unpaid','unpaid_leave','absence'].includes(leave);
      // 8. 給与エンジンが取込エラーにするデータを先にブロック
      if(!sch && leave!=='none'){ B(s.id,dstr,`休日に休暇区分(${LEAVE_TYPES[leave]})が入っています`); continue; }
      if((leave==='half_paid_am'||leave==='half_paid_pm') && !C.halfPaidAllowed(dstr)){
        B(s.id,dstr,'半日有給は月火水金と祝日週の木曜のみ設定できます'); continue; }
      // 4. 所定日に打刻も休暇区分もない → 満額払いになるためブロック
      if(sch && !ps.length && leave==='none'){
        if(s.active===false){ W(s.id,dstr,'データなし（退職済みのため参考。退職日より後ならそのままでOK）','noData'); }
        else B(s.id,dstr,'打刻も休暇区分もありません','noData');
        continue; }
      if(!ps.length) continue;
      const has = ty => ps.filter(p=>p.ty===ty);
      const ins=has('in'), outs=has('out');
      // 1-2. 出勤/退勤の欠落・順序異常
      if(ins.length && !outs.length){ B(s.id,dstr,'退勤打刻がありません', sch?'noOut':null); }
      if(!ins.length && outs.length){ B(s.id,dstr,'出勤打刻がありません（退勤のみ）', sch?'noIn':null); }
      if(ins.length && outs.length){
        const cin=hmToMin(ins.map(p=>p.t).sort()[0]);
        const cout=hmToMin(outs.map(p=>p.t).sort().slice(-1)[0]);
        if(cout<=cin) B(s.id,dstr,'退勤時刻が出勤時刻より前です');
        for(const p of ps){ const t=hmToMin(p.t);
          if(p.ty!=='in'&&p.ty!=='out'&&(t<cin||t>cout)){ B(s.id,dstr,`${PUNCH_TYPES[p.ty]}(${p.t})が勤務時間外です`); break; } }
      }
      // 3. ペア不成立
      for(const [a,b,lbl] of [['bs','be','休憩'],['os','oe','外出']]){
        const ev=ps.filter(p=>p.ty===a||p.ty===b); let open=0,bad=false;
        for(const p of ev){ if(p.ty===a){ if(open){bad=true;break;} open=1; } else { if(!open){bad=true;break;} open=0; } }
        if(bad||open) B(s.id,dstr,`${lbl}の打刻ペアが揃っていません（${lbl}入/${lbl}戻の対応を確認）`);
      }
      // 5. 同種別重複
      if(ins.length>1) W(s.id,dstr,`出勤が${ins.length}回打刻（最も早い時刻を採用）`);
      if(outs.length>1) W(s.id,dstr,`退勤が${outs.length}回打刻（最も遅い時刻を採用）`);
      // 6. 休憩ありの所定日で休憩打刻なし（半休日は昼休憩を挟まない勤務が正常のため除外）
      const halfDay = leave==='half_paid_am'||leave==='half_paid_pm';
      if(sch && sch[2]!=null && !fullDayLeave && !halfDay && ins.length && outs.length && !has('bs').length){
        W(s.id,dstr,'休憩打刻がありません（実働が過大→残業誤計算の恐れ）','noBreak'); }
      // 7. 所定休日出勤はエンジン非集計
      if(!sch && !C.isLegalHoliday(dstr) && ps.length){
        W(s.id,dstr,'祝日等の出勤は給与エンジンで自動集計されません（給与アプリで手入力対応）'); }
      // 9. 写真なし
      for(const p of ps){ if(p.src==='tap' && !p.ph) I(s.id,dstr,`${PUNCH_TYPES[p.ty]} ${p.t} の写真がありません`); }
    }
  }
  return {blocks, warns, infos};
}

/* ---------- 所定時刻（押し忘れ自動補完用。半休は勤務すべき半日に合わせる） ---------- */
function scheduledTimes(dstr, leave, calendar){
  const sch=(calendar||cal).schedule(dstr); if(!sch) return null;
  let start=sch[0], end=sch[1];
  if(leave==='half_paid_am') start=sch[3];   // 午前休→休憩明けから勤務
  if(leave==='half_paid_pm') end=sch[2];     // 午後休→休憩前まで勤務
  const hasBreak = sch[2]!=null && leave!=='half_paid_am' && leave!=='half_paid_pm';
  return {in:minToHM(start), out:minToHM(end),
    bs:hasBreak?minToHM(sch[2]):null, be:hasBreak?minToHM(sch[3]):null};
}

/* ---------- ワンタップ修正（異常一覧・締め画面の「要修正」から） ---------- */
const FIX_BTNS = {
  noData:[['absence','欠勤にする'],['full_paid','有給にする'],['fillDay','押し忘れ→所定時刻で打刻']],
  noOut:[['fillOut','押し忘れ→所定退勤を追加']],
  noIn:[['fillIn','押し忘れ→所定出勤を追加']],
  noBreak:[['fillBreak','所定休憩を追加']]
};
function quickFix(sid, dstr, action){
  const ym=monthKeyOf(dstr), doc=loadMonth(ym);
  const leave=dayLeave(doc,sid,dstr);
  const st=scheduledTimes(dstr, leave);
  const hasTy = ty => validPunches(doc,sid,dstr).some(p=>p.ty===ty);
  const addP=(ty,t,note)=>{
    if(hasTy(ty)) return; // 二重補完ガード（画面が古いままボタンを押した場合など）
    addCorrection(ym,{kind:'add',sid,d:dstr,before:null,after:{ty,t},note});
    doc.punches.push({id:genId(),sid,d:dstr,t,ty,at:Date.now(),src:'admin',ph:0,void:0,void_by:null});
  };
  if(action==='absence'||action==='full_paid'){
    addCorrection(ym,{kind:'leave',sid,d:dstr,before:{leave},after:{leave:action},note:'一覧からワンタップ修正'});
    doc.days[sid+'|'+dstr]={leave:action};
  } else if(action==='fillDay' && st){
    addP('in',st.in,'押し忘れ→所定時刻で自動補完');
    if(st.bs){ addP('bs',st.bs,'押し忘れ→所定時刻で自動補完'); addP('be',st.be,'押し忘れ→所定時刻で自動補完'); }
    addP('out',st.out,'押し忘れ→所定時刻で自動補完');
  } else if(action==='fillOut' && st){ addP('out',st.out,'退勤押し忘れ→所定時刻で自動補完');
  } else if(action==='fillIn' && st){ addP('in',st.in,'出勤押し忘れ→所定時刻で自動補完');
  } else if(action==='fillBreak' && st && st.bs){
    addP('bs',st.bs,'休憩打刻なし→所定時刻で自動補完'); addP('be',st.be,'休憩打刻なし→所定時刻で自動補完');
  }
  saveMonth(ym);
  adminTab(currentTab);
}
// 異常リストの1行（issues/closeタブ共用。fixがあればワンタップ修正ボタンを付ける）

/* =========================================================================
   IndexedDB（写真のみ。JSONバックアップには含めない。
   院内保管庫を設定した端末では、院内の Mac mini へだけ複製を送る＝vaultGetBlob）
   ========================================================================= */
let idb = null;
function idbOpen(){
  return new Promise((res,rej)=>{
    const rq = indexedDB.open('dakoku_photos_v1', 1);
    rq.onupgradeneeded = e=>{
      const db=e.target.result;
      const st=db.createObjectStore('photos',{keyPath:'punch_id'});
      st.createIndex('at','at');
    };
    rq.onsuccess = e=>{ idb=e.target.result; res(idb); };
    rq.onerror = ()=>rej(rq.error);
  });
}
function photoPut(rec){
  return new Promise((res,rej)=>{ if(!idb) return res(false);
    const tx=idb.transaction('photos','readwrite');
    tx.objectStore('photos').put(rec); tx.oncomplete=()=>{ vaultDirty(); res(true); }; tx.onerror=()=>rej(tx.error); });
}
function photoKeys(){ // 写真のキー(=打刻ID)一覧
  return new Promise((res)=>{ if(!idb) return res([]);
    try{
      const rq=idb.transaction('photos').objectStore('photos').getAllKeys();
      rq.onsuccess=()=>res((rq.result||[]).map(String)); rq.onerror=()=>res([]);
    }catch(e){ res([]); }
  });
}
function photoGet(punchId){
  return new Promise((res)=>{ if(!idb) return res(null);
    const rq=idb.transaction('photos').objectStore('photos').get(punchId);
    rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>res(null); });
}
function photoPurge(retentionDays){
  return new Promise((res)=>{ if(!idb) return res(0);
    const limit = Date.now() - retentionDays*24*3600*1000;
    const idx = idb.transaction('photos','readwrite').objectStore('photos').index('at');
    let n=0;
    idx.openCursor(IDBKeyRange.upperBound(limit)).onsuccess = e=>{
      const c=e.target.result; if(c){ c.delete(); n++; c.continue(); } else res(n); };
  });
}

/* =========================================================================
   カメラ（常時プレビュー・タップ瞬間キャプチャ）
   ========================================================================= */
const cam = { stream:null, ok:false };
async function camStart(){
  const v = document.getElementById('camVideo');
  const stateEl = document.getElementById('camState');
  try{
    if(cam.stream) cam.stream.getTracks().forEach(t=>t.stop());
    cam.stream = await navigator.mediaDevices.getUserMedia(
      {video:{facingMode:'user', width:{ideal:640}, height:{ideal:480}}, audio:false});
    v.srcObject = cam.stream; await v.play().catch(()=>{});
    cam.ok = true; stateEl.classList.add('hidden');
  }catch(e){
    cam.ok = false; stateEl.textContent = 'カメラ未使用\n(打刻は可能)';
    stateEl.classList.remove('hidden');
  }
}
function camCapture(){ // JPEG 480x360 Blob（失敗時 null）
  return new Promise((res)=>{
    try{
      const v = document.getElementById('camVideo');
      if(!cam.ok || !v.videoWidth) return res(null);
      const cw=480, ch=360, c=document.createElement('canvas');
      c.width=cw; c.height=ch;
      const ctx=c.getContext('2d');
      const scale=Math.max(cw/v.videoWidth, ch/v.videoHeight);
      const sw=cw/scale, sh=ch/scale;
      ctx.drawImage(v,(v.videoWidth-sw)/2,(v.videoHeight-sh)/2,sw,sh,0,0,cw,ch);
      c.toBlob(b=>res(b),'image/jpeg',0.7);
    }catch(e){ res(null); }
  });
}
document.addEventListener('visibilitychange',()=>{ // iOSバックグラウンド復帰でストリーム再取得
  if(!document.hidden && !document.getElementById('adminView').matches(':not(.hidden)')) camStart();
});
window.addEventListener('pageshow',()=>{ if(!document.hidden) camStart(); });

async function doPunch(sid){
  const now = new Date();
  const dstr = todayStr(now), hm = nowHM(now);
  const ym = monthKeyOf(dstr);
  const doc = loadMonth(ym);
  const s = staff.find(x=>x.id===sid);
  let ty = nextType(doc, sid, dstr);
  if(ty===null){ // 退勤済み → 打刻せず種別選択を出す
    showToast({err:true, msg:`${s.name}さんは本日退勤済みです`, sub:'必要なら下の種別を選んで打刻してください',
      chooseOnly:true, sid, dstr});
    return;
  }
  const dup = findDup(doc, sid, dstr, ty, hm);
  if(dup){
    showToast({err:true, msg:`${s.name}さん ${PUNCH_TYPES[ty]}は ${dup.t} に打刻済みです`,
      sub:'別の種別で打刻する場合は下から選んでください', chooseOnly:true, sid, dstr});
    return;
  }
  const blob = await camCapture(); // 打刻より先にフレーム確保（ゼロ遅延）
  const p = {id:genId(), sid, d:dstr, t:hm, ty, at:now.getTime(), src:'tap', ph:0, void:0, void_by:null};
  doc.punches.push(p); saveMonth(ym);          // 打刻データを先に確定保存
  renderGrid();
  if(blob){
    photoPut({punch_id:p.id, sid, at:p.at, blob}).then(()=>{
      p.ph=1; saveMonth(ym);
      const img=document.querySelector(`[data-toastimg="${p.id}"]`);
      if(img) blobToImg(blob, img);
    }).catch(()=>{});
  }
  showToast({msg:`${s.name}さん ${PUNCH_TYPES[ty]} ${hm} ✓`, sub:'間違えたら「取消」か種別を変更（10秒間）',
    punch:p, ym, blob});
}
function blobToImg(blob, img){ const u=URL.createObjectURL(blob); img.onload=()=>URL.revokeObjectURL(u); img.src=u; }

let toastTimer=null;
function showToast(o){
  const wrap = document.getElementById('toastWrap');
  wrap.innerHTML='';
  if(toastTimer){ clearInterval(toastTimer); toastTimer=null; }
  const t = document.createElement('div');
  t.className='toast'+(o.err?' err':'');
  let inner = '';
  if(o.punch) inner += `<img data-toastimg="${o.punch.id}" alt="">`;
  inner += `<div class="toastMsg">${esc(o.msg)}<small>${esc(o.sub||'')}</small></div>`;
  if(o.punch) inner += `<button data-undo>取消 <span data-cnt>${UNDO_SECONDS}</span></button>`;
  t.innerHTML = inner;
  wrap.appendChild(t);
  // 種別変更/選択パネル
  const panel = document.createElement('div');
  panel.className='typePanel';
  panel.innerHTML = `<div class="tpTitle">${o.chooseOnly?'種別を選んで打刻:':'種別を変更:'}</div>
    <div class="tpBtns">${Object.entries(PUNCH_TYPES).map(([k,v])=>
      `<button data-ty="${k}" class="${o.punch&&o.punch.ty===k?'cur':''}">${v}</button>`).join('')}</div>`;
  wrap.appendChild(panel);
  if(o.punch && o.blob){ const img=t.querySelector(`[data-toastimg="${o.punch.id}"]`); if(img) blobToImg(o.blob,img); }
  const clearAll = ()=>{ wrap.innerHTML=''; if(toastTimer){clearInterval(toastTimer);toastTimer=null;} };
  panel.querySelectorAll('[data-ty]').forEach(b=>{
    b.onclick = ()=>{
      const ty=b.dataset.ty;
      if(o.chooseOnly){ punchWithType(o.sid, ty); return; } // punchWithType側のトーストが置き換える
      const doc=loadMonth(o.ym);
      const p=doc.punches.find(x=>x.id===o.punch.id);
      if(p){ p.ty=ty; saveMonth(o.ym); renderGrid(); }
      panel.querySelectorAll('button').forEach(x=>x.classList.toggle('cur',x.dataset.ty===ty));
      t.querySelector('.toastMsg').firstChild.textContent =
        `${staff.find(x=>x.id===p.sid).name}さん ${PUNCH_TYPES[ty]} ${p.t} ✓`;
    };
  });
  const undoBtn = t.querySelector('[data-undo]');
  if(undoBtn) undoBtn.onclick = ()=>{
    const doc=loadMonth(o.ym);
    const p=doc.punches.find(x=>x.id===o.punch.id);
    if(p){ p.void=1; p.void_by='self'; saveMonth(o.ym); renderGrid(); }
    clearAll();
  };
  let left = UNDO_SECONDS;
  toastTimer = setInterval(()=>{
    left--;
    const c=t.querySelector('[data-cnt]'); if(c) c.textContent=left;
    if(left<=0) clearAll();
  },1000);
}
async function punchWithType(sid, ty){ // 種別指定打刻（退勤済み後の例外・外出/戻り等）

/* ---------- PIN ---------- */
async function sha256hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function pinLock(){ return lsGet('pinlock_v1', {n:0, until:0}); }
function savePinLock(v){ lsSet('pinlock_v1', v); }

function openPinPad(title, onOK){
  let entered='';
  const root=document.getElementById('modalRoot');
  root.innerHTML = `<div class="modalBack"><div class="modal" style="max-width:340px">
    <h3>${title}</h3>
    <div class="pinDisp" id="pinDisp"></div><div class="pinMsg" id="pinMsg"></div>
    <div class="pinPad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join('')}
      <button data-n="C">C</button><button data-n="0">0</button><button data-n="OK">OK</button></div>
    <div style="text-align:center"><button class="btn sec" onclick="closeModal()">キャンセル</button></div>
  </div></div>`;
  const disp=document.getElementById('pinDisp'), msg=document.getElementById('pinMsg');
  root.querySelectorAll('[data-n]').forEach(b=>{
    b.onclick = async ()=>{
      const n=b.dataset.n;
      if(n==='C'){ entered=''; }
      else if(n==='OK'){
        const lock=pinLock();
        if(Date.now()<lock.until){ msg.textContent=`ロック中です（${Math.ceil((lock.until-Date.now())/1000)}秒後に再試行）`; return; }
        const r = await onOK(entered);
        if(r!==true){ entered=''; disp.textContent='';
          const l=pinLock(); l.n++;
          if(l.n>=5){ l.until=Date.now()+60000; l.n=0; msg.textContent='5回失敗。60秒間ロックします'; }
          else msg.textContent=r||'PINが違います';
          savePinLock(l); return; }
        savePinLock({n:0,until:0});
        return;
      }
      else if(entered.length<6) entered+=n;
      disp.textContent='●'.repeat(entered.length);
    };
  });
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

function openAdmin(){
  if(!settings.pin_hash){ openPinSetup(); return; }
  openPinPad('管理PINを入力', async pin=>{
    if(pin.length<4) return 'PINは4桁以上です';
    const h = await sha256hex(settings.pin_salt + pin);
    if(h!==settings.pin_hash) return 'PINが違います';
    closeModal(); showAdmin(); return true;
  });
}
function openPinSetup(){
  let first=null;
  openPinPad('管理PINを設定（4〜6桁）', async pin=>{
    if(pin.length<4) return '4桁以上で設定してください';
    if(first===null){ first=pin; document.getElementById('pinMsg').textContent='確認のためもう一度入力してください';
      document.getElementById('pinDisp').textContent=''; return '確認のためもう一度入力'; }
    if(pin!==first){ first=null; return '一致しません。最初からやり直してください'; }
    settings.pin_salt = [...crypto.getRandomValues(new Uint8Array(8))].map(b=>b.toString(16).padStart(2,'0')).join('');
    settings.pin_hash = await sha256hex(settings.pin_salt + pin);
    saveSettings(); closeModal(); showAdmin(); return true;
  });
}

        <select id="leaveSel">${Object.entries(LEAVE_TYPES).map(([k,v])=>
          `<option value="${k}" ${leave===k?'selected':''}>${v}</option>`).join('')}</select></div>
      <div style="flex:1"><label class="f">修正メモ（任意・履歴に残ります）</label>
        <input id="noteInp" style="width:100%" placeholder="例: 本人申告により追加"></div>
    </div>
    <div id="dayMsg" class="pinMsg" style="text-align:left;margin-top:8px"></div>
    <div style="margin-top:14px;display:flex;gap:10px;justify-content:flex-end">
      <button class="btn sec" onclick="closeModal()">閉じる</button>
      <button class="btn" id="saveDay">変更を保存</button>
    </div>
  </div></div>`;
  // 写真サムネ読込
  for(const p of ps){ if(!p.ph) continue;
    photoGet(p.id).then(rec=>{
      const el=root.querySelector(`[data-photo="${p.id}"]`);
      if(!el) return;
      if(!rec){ el.textContent='写真なし'; return; }
      const img=document.createElement('img');
      blobToImg(rec.blob,img);
      img.onclick=()=>openPhotoModal(rec.blob, `${esc(s?s.name:'')} ${dstr} ${p.t}`);
      el.replaceWith(img); img.dataset.photo=p.id;
    });
  }
  const note = ()=>root.querySelector('#noteInp').value.trim();
  // 個別ボタン（取消・再分類）は即時反映＋履歴
  root.querySelectorAll('[data-void]').forEach(b=>{
    b.onclick=()=>{
      const pid=b.closest('.punchRow').dataset.pid;
      const p=doc.punches.find(x=>x.id===pid);
      addCorrection(ym,{kind:'void',sid,d:dstr,before:{ty:p.ty,t:p.t},after:null,note:note()});
      p.void=1; p.void_by='admin'; saveMonth(ym); openDayEditor(sid,dstr);
    };
  });
  root.querySelectorAll('[data-reclass]').forEach(b=>{
    b.onclick=()=>{
      const pid=b.closest('.punchRow').dataset.pid;
      const p=doc.punches.find(x=>x.id===pid);
      const map={bs:'os',os:'bs',be:'oe',oe:'be'};
      addCorrection(ym,{kind:'reclass',sid,d:dstr,before:{ty:p.ty,t:p.t},after:{ty:map[p.ty],t:p.t},note:note()});
      p.ty=map[p.ty]; saveMonth(ym); openDayEditor(sid,dstr);
    };
  });
  root.querySelector('#addBtn').onclick=()=>{
    const t=root.querySelector('#addT').value, ty=root.querySelector('#addTy').value;
    const msg=root.querySelector('#dayMsg');
    if(!t){ msg.textContent='追加する時刻を入力してください'; return; }
    addCorrection(ym,{kind:'add',sid,d:dstr,before:null,after:{ty,t},note:note()});
    doc.punches.push({id:genId(),sid,d:dstr,t,ty,at:Date.now(),src:'admin',ph:0,void:0,void_by:null});
    saveMonth(ym); openDayEditor(sid,dstr);
  };
  root.querySelector('#saveDay').onclick=()=>{
    // 時刻・種別の編集を差分検出して保存
    root.querySelectorAll('.punchRow').forEach(row=>{
      const pid=row.dataset.pid; if(!pid) return;
      const p=doc.punches.find(x=>x.id===pid); if(!p||p.void) return;
      const nt=row.querySelector('[data-edit-t]').value, nty=row.querySelector('[data-edit-ty]').value;
      if(nt && (nt!==p.t || nty!==p.ty)){
        if(nt!==p.t||nty!==p.ty){
          addCorrection(ym,{kind:'edit',sid,d:dstr,before:{ty:p.ty,t:p.t},after:{ty:nty,t:nt},note:note()});
          p.t=nt; p.ty=nty;
        }
      }
    });
    // 休暇区分
    const nl=root.querySelector('#leaveSel').value;
    if(nl!==leave){
      if((nl==='half_paid_am'||nl==='half_paid_pm') && !cal.halfPaidAllowed(dstr)){
        root.querySelector('#dayMsg').textContent='半日有給は月火水金と祝日週の木曜のみ設定できます'; return; }
      if(nl!=='none' && !cal.schedule(dstr)){
        root.querySelector('#dayMsg').textContent='休診日に休暇区分は設定できません（給与取込エラーになります）'; return; }
      addCorrection(ym,{kind:'leave',sid,d:dstr,before:{leave},after:{leave:nl},note:note()});
      if(nl==='none') delete doc.days[sid+'|'+dstr];
      else doc.days[sid+'|'+dstr]={leave:nl};
    }
    saveMonth(ym); closeModal();
    if(currentTab) adminTab(currentTab);
  };
}

    navigator.share({files:[file], title:fname}).catch(()=>{});

  const a=document.createElement('a');

// JSONバックアップの中身（ファイル書き出しと院内保管庫への送信で共用。形を変えるときは両方に効く）
function buildBackupData(){
  const months={}; for(const ym of listMonthKeys()) months[ym]=loadMonth(ym);
  return {app:'dakoku', version:APP_VERSION, schema:DATA_SCHEMA, exported_at:new Date().toISOString(),
    settings, staff, months};
}
// 復元前の形チェック（ファイル復元・Mac mini からの復元で共用）。問題なければ ''
function validateBackupData(d){
  if(!d || typeof d!=='object') return 'データを読み取れませんでした';
  if(d.app!=='dakoku') return 'このアプリのバックアップではありません';
  // 職員一覧・設定・月データは書き出しに必ず入っている。欠けたデータで職員やPINを消さないよう、そろっていなければ受け付けない
  if(!Array.isArray(d.staff)) return 'スタッフ一覧が入っていません';
  if(!d.settings || typeof d.settings!=='object' || Array.isArray(d.settings)) return '設定が入っていません';
  if(d.months==null || typeof d.months!=='object') return '打刻データが入っていません';
  if(d.months!=null){
    if(typeof d.months!=='object' || Array.isArray(d.months)) return '打刻データの形が違います';
    for(const ym in d.months){
      const m=d.months[ym];
      if(!/^\d{4}-\d{2}$/.test(ym) || !m || typeof m!=='object' || !Array.isArray(m.punches) ||
         !m.days || typeof m.days!=='object' || !Array.isArray(m.corrections))
        return `打刻データ（${ym}）の形が違います`;
    }
  }
  return '';
}
// 復元の適用（従来の importBackup と同じ手順: 設定・スタッフは置き換え、月データはバックアップにある月を上書き）
// 途中で保存に失敗したら、書き換えた分をすべて元に戻して例外を投げる（半分だけ置き換わった状態を残さない）
function applyBackupData(d){
  const keys=['settings_v1','staff_v1'].concat(Object.keys(d.months||{}).map(ym=>'m_'+ym+'_v1'));
  const before={}; keys.forEach(k=>{ try{ before[k]=localStorage.getItem(NS+k); }catch(e){ before[k]=null; } });
  const prev={settings, staff, months:{}}; for(const ym in (d.months||{})) prev.months[ym]=monthCache[ym];
  try{
    settings=Object.assign({},DEFAULT_SETTINGS,d.settings); saveSettings();
    staff=d.staff||[]; saveStaff();
    for(const ym in (d.months||{})){ monthCache[ym]=d.months[ym]; saveMonth(ym); }
  }catch(e){
    // 書いたのと逆の順番で戻す（後から書いた分を先に戻すので、戻すたびに空きが増え、元の大きさなら必ず入る）
    let back=true;
    keys.slice().reverse().forEach(k=>{ try{ if(before[k]==null) localStorage.removeItem(NS+k); else localStorage.setItem(NS+k, before[k]); }catch(_){ back=false; } });
    // 画面側の状態は、推測でなく端末の保存から読み直す（メモリと保存が食い違わないように）
    settings=Object.assign({}, DEFAULT_SETTINGS, lsGet('settings_v1', {})); cal=Calendar(settings);
    staff=lsGet('staff_v1', []);
    for(const ym in prev.months) delete monthCache[ym];
    if(!back) e.message=(e.message||'')+'（⚠ 元の状態に完全には戻せませんでした。すぐに院長へ連絡してください）';
    throw e;
  }
}
function exportBackup(){
  const data=buildBackupData();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
  a.download=`打刻バックアップ_${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
}
function importBackup(inp){
  const f=inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      const bad=validateBackupData(d); if(bad) throw Error(bad);
      if(!confirm(`${d.exported_at} のバックアップで現在のデータを置き換えます。よろしいですか？`)) return;
      applyBackupData(d);
      try{ if(vault) vault.pushNow(); }catch(_){}   // 意図した置き換えなので件数が減っても Mac mini に送る
      alert('復元しました'); adminTab('settings');
    }catch(e){ alert('復元に失敗: '+e.message); }
  };
  rd.readAsText(f);
}

/* =========================================================================
   院内保管庫（Mac mini への自動バックアップ）
   保存するたびに（lsSet / photoPut）複製を院内の Mac mini へ送る。端末内の保存・打刻には影響しない。
   合言葉・住所・iPadの名前は同じ配信元の院内アプリ共通（管理画面「設定」で入力）。正本=Ai/院内保管庫/
   ★実データの起動時だけ作る（boot の idbOpen 後）。セルフテスト中は作らない＝見本データを送らない。
   送る中身 = JSONバックアップ（buildBackupData）と同じ形。写真は別送（キー=打刻ID、値=dataURL文字列）。

const VAULT_LABELS = {staff:'職員', punches:'打刻記録'};
// 院長決定（2026-09-24）：打刻写真は Mac mini に送らない。写真は本人確認用で、iPad の中だけに置き保存日数で消す。
// （Mac mini に送るのは打刻・職員・設定のデータだけ。true にすると写真も送る仕組みは残してある）
const VAULT_SEND_PHOTOS = false;
const VAULT_ID_RE = /^[A-Za-z0-9_\-][A-Za-z0-9_\-.]{0,127}$/;   // 保管庫が受け付ける写真IDの形（genId() の 'p_…' はそのまま合う）
function vaultCounts(d){
  let punches=0; for(const ym in (d.months||{})) punches+=((d.months[ym]||{}).punches||[]).length;
  return {staff:(d.staff||[]).length, punches};   // 打刻記録は取消済みも含む件数（記録そのものの数）
}
// 書き出し時刻(exported_at)は外す：中身が同じなら Mac mini 側で重複として捨てられ、控えが無駄に増えない
function vaultSnapshot(){ const d=buildBackupData(); delete d.exported_at; return {data:d, counts:vaultCounts(d)}; }
function blobToDataURL(blob){
  return new Promise((res,rej)=>{ const fr=new FileReader();
    fr.onload=()=>res(String(fr.result)); fr.onerror=()=>rej(fr.error); fr.readAsDataURL(blob); });
}
function dataURLToBlob(s){ // 'data:image/jpeg;base64,…' → Blob（画像以外・壊れた文字列は null）
  const m=typeof s==='string' && s.match(/^data:(image\/[A-Za-z0-9.+-]+);base64,([A-Za-z0-9+/=\s]*)$/);
  if(!m) return null;
  const bin=atob(m[2].replace(/\s+/g,''));
  const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  return new Blob([u8],{type:m[1]});
}
async function vaultListBlobIds(){ return (await photoKeys()).filter(id=>VAULT_ID_RE.test(id)); }
async function vaultGetBlob(id){
  const rec=await photoGet(id);
  if(!rec || !rec.blob) return null;
  return typeof rec.blob==='string' ? rec.blob : blobToDataURL(rec.blob);
}
// Mac mini からの復元：データは JSON ファイル復元と同じ手順（validateBackupData → applyBackupData）で置き換え、
// 写真は「この端末に無いもの」だけ書き戻す（端末にしか無い写真は消さない・上書きしない）
async function vaultRestore(data, blobs){
  const bad=validateBackupData(data);
  if(bad) return {ok:false, message:'受け取ったデータの形式が違います（'+bad+'）'};
  vaultRestoring=true;
  try{
    try{ applyBackupData(data); }
    catch(e){ return {ok:false, message:'端末への保存に失敗しました（容量不足の可能性）：'+(e&&e.message||e)}; }
    const pmap={};
    for(const ym in (data.months||{})) for(const p of (data.months[ym].punches||[])) if(p && p.id) pmap[p.id]=p;
    let put=0, fail=0, old=0, listNG=false;
    const limit=Date.now()-(+settings.photo_retention_days||90)*24*3600*1000;
    if(VAULT_SEND_PHOTOS && idb && blobs && typeof blobs.ids==='function'){
      let ids=[];
      try{ ids=await blobs.ids(); }catch(e){ listNG=true; }
      const have=new Set(await photoKeys());
      for(const id of (ids||[])){
        const p=pmap[id];
        if(!p || have.has(id)) continue;             // 打刻が無い写真・端末にある写真は触らない
        if(!(p.at>limit)){ old++; continue; }         // 保存期間切れ（戻しても次の起動で消える）
        try{
          const blob=dataURLToBlob(await blobs.get(id));
          if(!blob){ fail++; continue; }
          await photoPut({punch_id:id, sid:p.sid, at:p.at, blob}); put++;
        }catch(e){ fail++; }
      }
    }
    const n=vaultCounts(data).punches;
    let msg=VAULT_SEND_PHOTOS ? `職員${staff.length}名・打刻記録${n}件・写真${put}枚を復元しました。`
      : `職員${staff.length}名・打刻記録${n}件を復元しました（打刻写真はこの iPad の中だけに保存しているため、復元には含まれません）。`;
    if(old) msg+=`（保存期間${settings.photo_retention_days}日を過ぎた写真${old}枚は戻していません）`;
    if(fail) msg+=`写真${fail}枚は受け取れませんでした（もう一度復元すると足りない写真だけ取り直します）。`;
    if(listNG) msg+='写真の一覧を Mac mini から受け取れませんでした（打刻データは復元済み）。';
    if(VAULT_SEND_PHOTOS && !idb) msg+='この端末では写真の保存場所が使えないため、写真は戻していません。';
    msg+='この端末にしか無い月の記録はそのまま残しています。管理PINも保管した時点のものに戻っています。まもなく月次カレンダーに切り替わります。';
    try{ renderGrid(); }catch(_){}
    setTimeout(()=>{ try{ if(!document.getElementById('adminView').classList.contains('hidden')) adminTab('cal'); }catch(_){} },2500);
    return {ok:true, message:msg};
  } finally { vaultRestoring=false; }
}
function initVault(){
  const opt={app:'dakoku', label:'勤怠打刻', appVersion:APP_VERSION, getSnapshot:vaultSnapshot, restore:vaultRestore};
  if(VAULT_SEND_PHOTOS){ opt.listBlobIds=vaultListBlobIds; opt.getBlob=vaultGetBlob; }   // 写真は送らない（院長決定）
  vault=createVault(opt);
  try{ vault.mountBadge(document.getElementById('vaultBadge')); }catch(_){}
}

function seedDocFromCSV(csvText){ // CSV → 打刻ドキュメント（selftest/devSeed共用の純関数）
  const doc=emptyMonthDoc();
  const lines=csvText.trim().split('\n'); lines.shift();
  for(const line of lines){
    const [d,idStr,ci,co,brStr,leave,outStr]=line.split(',');
    const sid=+idStr, br=+brStr, outing=+outStr;
    const at=Date.parse(d+'T00:00:00');
    const push=(ty,t)=>doc.punches.push({id:genId(),sid,d,t,ty,at,src:'tap',ph:0,void:0,void_by:null});
    if(ci) push('in',ci);
    if(co) push('out',co);
    if(br===60){ push('bs','12:30'); push('be','13:30'); }
    else if(br===90){ push('bs','12:00'); push('be','13:30'); }
    else if(br>0){ push('bs','12:30'); push('be',minToHM(750+br)); }
    if(outing>0){ push('os','15:00'); push('oe',minToHM(900+outing)); }
    if(leave && leave!=='none') doc.days[sid+'|'+d]={leave};
  }
  return doc;
}
